high)`: return `True` if `x` is between `low` and `high`, ends included. Use a chained comparison.\n"}, "starter": "def in_range(x, low, high):\n    pass\n", "hint": {"ro": "`return low <= x <= high`", "en": "`return low <= x <= high`"}, "solution": "def in_range(x, low, high):\n    return low <= x <= high\n", "tests": [{"append": "print(in_range(5, 1, 10), in_range(1, 1, 10), in_range(11, 1, 10))", "expect": "True True False"}, {"append": "print(in_range(-3, -5, -1), in_range(0, -5, -1))", "expect": "True False", "hidden": true}]}, {"title": {"ro": "Media a trei numere", "en": "Average of three numbers"}, "task": {"ro": "Completează `avg3(a, b, c)`: returnează media celor trei numere. Atenție la paranteze și la ordinea operațiilor!\n", "en": "Complete `avg3(a, b, c)`: return the average of the three numbers. Watch the parentheses and the order of operations!\n"}, "starter": "def avg3(a, b, c):\n    return a + b + c / 3\n", "hint": {"ro": "Împărțirea se face înaintea adunării. Pune suma între paranteze.", "en": "Division happens before addition. Put the sum in parentheses."}, "solution": "def avg3(a, b, c):\n    return (a + b + c) / 3\n", "tests": [{"append": "print(avg3(3, 6, 9))", "expect": "6.0"}, {"append": "print(avg3(1, 2, 3))", "expect": "2.0", "hidden": true}]}]}, {"id": "l08", "n": 8, "part": 2, "domain": 2, "title": {"ro": "Decizii: if, elif, else, match", "en": "Decisions: if, elif, else, match"}, "goal": {"ro": "Să scrii și să citești cod care ia decizii: condiții simple și compuse, ramuri imbricate, expresia condițională și match.", "en": "Write and read code that makes decisions: simple and compound conditions, nested branches, the conditional expression and match."}, "theory": {"ro": "Programele iau decizii cu `if`. Condiția se termină cu `:` și blocul de dedesubt este indentat. Python verifică ramurile de sus în jos și execută **doar prima** ramură a cărei condiție este adevărată.\n\n```python run\nscore = 72\nif score >= 90:\n    print(\"Grade A\")\nelif score >= 75:\n    print(\"Grade B\")\nelif score >= 60:\n    print(\"Grade C\")\nelse:\n    print(\"Grade F\")\n```\n\n> warn: Ordinea contează. Dacă pui `score >= 60` înaintea lui `score >= 90`, un scor de 95 va primi nota C, pentru că prima condiție adevărată câștigă.\n\n```python run\nscore = 95\nif score >= 60:\n    print(\"C\")\nelif score >= 90:\n    print(\"A\")\n```\n\n### Condiții compuse\n\nCombini condițiile cu `and`, `or`, `not`. Poți folosi și comparații înlănțuite și apartenența.\n\n```python run\nage = 16\nhas_id = True\nif age >= 18 and has_id:\n    print(\"Entry allowed\")\nelif age >= 16 and has_id:\n    print(\"Entry with parental consent\")\nelse:\n    print(\"Entry not allowed\")\nif 10 <= age <= 20 and age not in [13, 14]:\n    print(\"Teen range\")\n```\n\n### Valori „adevărate\" ca condiție\n\nUn `if` acceptă orice valoare. Listele, textele și numerele **goale sau zero** sunt `False`; restul sunt `True`.\n\n```python run\nitems = []\nif items:\n    print(\"has items\")\nelse:\n    print(\"empty list\")\nname = \"Ana\"\nif name:\n    print(\"name given\")\n```\n\n### Condiții imbricate\n\nUn `if` poate sta în interiorul altui `if`. Păstrează cel mult două niveluri ca să rămână clar.\n\n```python run\nis_weekend = True\nis_sunny = False\nif is_weekend:\n    if is_sunny:\n        print(\"Go to the park\")\n    else:\n        print(\"Watch a film\")\nelse:\n    print(\"School day\")\n```\n\n### Expresia condițională (ternar)\n\n```python run\nn = 7\nkind = \"even\" if n % 2 == 0 else \"odd\"\nprint(kind)\n```\n\n### match (Python 3.10+)\n\n`match` compară o valoare cu mai multe tipare. `|` înseamnă „sau\", iar `case _` prinde orice altceva.\n\n```python run\nday = \"Saturday\"\nmatch day:\n    case \"Monday\" | \"Tuesday\" | \"Wednesday\" | \"Thursday\" | \"Friday\":\n        print(\"School day\")\n    case \"Saturday\":\n        print(\"Weekend\")\n    case _:\n        print(\"Unknown day\")\n```\n\n> exam: Cea mai frecventă greșeală este `=` în loc de `==` într-o condiție: `if x = 10:` este `SyntaxError`. Ai nevoie de `if x == 10:`. Un bloc gol se scrie cu `pass`.\n", "en": "Programs make decisions with `if`. The condition ends with `:` and the block below is indented. Python checks the branches from top to bottom and runs **only the first** branch whose condition is true.\n\n```python run\nscore = 72\nif score >= 90:\n    print(\"Grade A\")\nelif score >= 75:\n    print(\"Grade B\")\nelif score >= 60:\n    print(\"Grade C\")\nelse:\n    print(\"Grade F\")\n```\n\n> warn: Order matters. If you put `score >= 60` before `score >= 90`, a score of 95 gets grade C, because the first true condition wins.\n\n```python run\nscore = 95\nif score >= 60:\n    print(\"C\")\nelif score >= 90:\n    print(\"A\")\n```\n\n### Compound conditions\n\nCombine conditions with `and`, `or`, `not`. You can also use chained comparisons and membership.\n\n```python run\nage = 16\nhas_id = True\nif age >= 18 and has_id:\n    print(\"Entry allowed\")\nelif age >= 16 and has_id:\n    print(\"Entry with parental consent\")\nelse:\n    print(\"Entry not allowed\")\nif 10 <= age <= 20 and age not in [13, 14]:\n    print(\"Teen range\")\n```\n\n### \"Truthy\" values as a condition\n\nAn `if` accepts any value. **Empty or zero** lists, texts and numbers are `False`; the rest are `True`.\n\n```python run\nitems = []\nif items:\n    print(\"has items\")\nelse:\n    print(\"empty list\")\nname = \"Ana\"\nif name:\n    print(\"name given\")\n```\n\n### Nested conditions\n\nAn `if` can sit inside another `if`. Keep at most two levels so the code stays clear.\n\n```python run\nis_weekend = True\nis_sunny = False\nif is_weekend:\n    if is_sunny:\n        print(\"Go to the park\")\n    else:\n        print(\"Watch a film\")\nelse:\n    print(\"School day\")\n```\n\n### The conditional expression (ternary)\n\n```python run\nn = 7\nkind = \"even\" if n % 2 == 0 else \"odd\"\nprint(kind)\n```\n\n### match (Python 3.10+)\n\n`match` compares a value against several patterns. `|` means \"or\", and `case _` catches everything else.\n\n```python run\nday = \"Saturday\"\nmatch day:\n    case \"Monday\" | \"Tuesday\" | \"Wednesday\" | \"Thursday\" | \"Friday\":\n        print(\"School day\")\n    case \"Saturday\":\n        print(\"Weekend\")\n    case _:\n        print(\"Unknown day\")\n```\n\n> exam: The most common mistake is `=` instead of `==` in a condition: `if x = 10:` is a `SyntaxError`. You need `if x == 10:`. An empty block is written with `pass`.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "score = 95\nif score >= 60:\n    print(\"C\")\nelif score >= 90:\n    print(\"A\")\n", "options": ["A", "C", "C și A", "nimic"], "answer": 1, "verify": "out", "expl": {"ro": "Prima condiție adevărată câștigă și restul ramurilor se sar. 95 >= 60 este adevărat, deci se afișează C.", "en": "The first true condition wins and the other branches are skipped. 95 >= 60 is true, so C is printed."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "items = []\nif items:\n    print(\"has\")\nelse:\n    print(\"empty\")\n", "options": ["has", "empty", "Error", "None"], "answer": 1, "verify": "out", "expl": {"ro": "O listă goală este considerată `False` într-o condiție.", "en": "An empty list counts as `False` in a condition."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "x = 7\nprint(\"even\" if x % 2 == 0 else \"odd\")\n", "options": ["even", "odd", "7", "True"], "answer": 1, "verify": "out", "expl": {"ro": "Expresia condițională alege `\"odd\"` pentru că `7 % 2 == 0` este fals.", "en": "The conditional expression picks `\"odd\"` because `7 % 2 == 0` is false."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "cmd = \"stop\"\nmatch cmd:\n    case \"go\" | \"start\":\n        print(\"moving\")\n    case \"stop\":\n        print(\"halt\")\n    case _:\n        print(\"unknown\")\n", "options": ["moving", "halt", "unknown", "stop"], "answer": 1, "verify": "out", "expl": {"ro": "Valoarea `\"stop\"` se potrivește cu al doilea `case`.", "en": "The value `\"stop\"` matches the second `case`."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul?", "en": "What error does the code produce?"}, "code": "x = 10\nif x = 10:\n    print(\"ten\")\n", "options": ["SyntaxError", "NameError", "TypeError", "IndentationError"], "answer": 0, "verify": "err", "expl": {"ro": "`=` este atribuire, nu comparație. Pentru comparație folosești `==`.", "en": "`=` is assignment, not comparison. For comparison use `==`."}}, {"type": "dropdown", "q": {"ro": "Completează codul ca să afișeze `Warm`.", "en": "Complete the code so it prints `Warm`."}, "code": "temperature = 25\nif temperature [[0]] 30:\n    print(\"Hot\")\n[[1]] temperature >= 20:\n    print(\"Warm\")\n[[2]]:\n    print(\"Cool\")\n", "blanks": [{"options": [">", "<", "=="], "answer": 0}, {"options": ["elif", "else if", "elseif"], "answer": 0}, {"options": ["else", "elif", "otherwise"], "answer": 0}], "expect": "Warm", "expl": {"ro": "Lanțul corect este `if` / `elif` / `else`. Python nu are `else if` sau `elseif`.", "en": "The correct chain is `if` / `elif` / `else`. Python has no `else if` or `elseif`."}}], "exercises": [{"title": {"ro": "Calculatorul de note", "en": "Grade calculator"}, "task": {"ro": "Completează `grade(score)`: returnează `\"A\"` pentru 90 sau mai mult, `\"B\"` pentru 80–89, `\"C\"` pentru 70–79, `\"D\"` pentru 60–69 și `\"F\"` sub 60.\n", "en": "Complete `grade(score)`: return `\"A\"` for 90 or more, `\"B\"` for 80–89, `\"C\"` for 70–79, `\"D\"` for 60–69 and `\"F\"` below 60.\n"}, "starter": "def grade(score):\n    pass\n", "hint": {"ro": "Verifică de sus în jos: `if score >= 90`, apoi `elif score >= 80` și așa mai departe.", "en": "Check from the top down: `if score >= 90`, then `elif score >= 80` and so on."}, "solution": "def grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    elif score >= 60:\n        return \"D\"\n    else:\n        return \"F\"\n", "tests": [{"append": "print(grade(95), grade(80), grade(79), grade(60), grade(10))", "expect": "A B C D F"}, {"append": "print(grade(90), grade(89), grade(70), grade(59))", "expect": "A B C F", "hidden": true}]}, {"title": {"ro": "Clasificatorul de numere", "en": "Number classifier"}, "task": {"ro": "Citește un număr întreg. Pe prima linie afișează `positive`, `negative` sau `zero`. Pe a doua linie afișează `even` sau `odd`. (Zero este par.)\n", "en": "Read a whole number. On the first line print `positive`, `negative` or `zero`. On the second line print `even` or `odd`. (Zero is even.)\n"}, "starter": "n = int(input())\n# first line: sign. second line: parity\n", "hint": {"ro": "Două blocuri `if` separate: unul pentru semn, unul pentru paritate (`n % 2 == 0`).", "en": "Two separate `if` blocks: one for the sign, one for parity (`n % 2 == 0`)."}, "demoInput": ["7"], "solution": "n = int(input())\nif n > 0:\n    print(\"positive\")\nelif n < 0:\n    print(\"negative\")\nelse:\n    print(\"zero\")\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n", "tests": [{"stdin": ["7"], "last": 2, "expect": "positive\nodd"}, {"stdin": ["-4"], "last": 2, "expect": "negative\neven"}, {"stdin": ["0"], "last": 2, "expect": "zero\neven", "hidden": true}]}, {"title": {"ro": "Planificatorul de zile cu match", "en": "Day planner with match"}, "task": {"ro": "Completează `day_type(day)` cu `match`: de luni până vineri returnează `\"school\"`, sâmbăta `\"weekend\"`, duminica `\"rest\"`, iar orice altceva `\"unknown\"`. Zilele se dau în engleză, cu literă mare (`\"Monday\"`).\n", "en": "Complete `day_type(day)` using `match`: Monday to Friday return `\"school\"`, Saturday `\"weekend\"`, Sunday `\"rest\"`, and anything else `\"unknown\"`. Days are given in English with a capital letter (`\"Monday\"`).\n"}, "starter": "def day_type(day):\n    pass\n", "hint": {"ro": "`case \"Monday\" | \"Tuesday\" | ...:` și la final `case _:`.", "en": "`case \"Monday\" | \"Tuesday\" | ...:` and `case _:` at the end."}, "solution": "def day_type(day):\n    match day:\n        case \"Monday\" | \"Tuesday\" | \"Wednesday\" | \"Thursday\" | \"Friday\":\n            return \"school\"\n        case \"Saturday\":\n            return \"weekend\"\n        case \"Sunday\":\n            return \"rest\"\n        case _:\n            return \"unknown\"\n", "tests": [{"append": "print(day_type('Monday'), day_type('Saturday'), day_type('Sunday'), day_type('Funday'))", "expect": "school weekend rest unknown"}, {"append": "print(day_type('Friday'), day_type('Wednesday'))", "expect": "school school", "hidden": true}]}]}, {"id": "l09", "n": 9, "part": 2, "domain": 2, "title": {"ro": "Bucle: while și for", "en": "Loops: while and for"}, "goal": {"ro": "Să repeți acțiuni cu while și for, să controlezi bucla cu break, continue și pass și să urmărești bucle imbricate.", "en": "Repeat actions with while and for, control a loop with break, continue and pass, and trace nested loops."}, "theory": {"ro": "O buclă repetă un bloc de cod. Python are două feluri: `while` (cât timp o condiție e adevărată) și `for` (pentru fiecare element dintr-o secvență).\n\n### while\n\nTrebuie să **modifici ceva în buclă** ca să ajungă condiția falsă. Altfel bucla rulează la nesfârșit (buclă infinită).\n\n```python run\ncountdown = 3\nwhile countdown > 0:\n    print(\"Countdown:\", countdown)\n    countdown -= 1      # without this line the loop never ends\nprint(\"Go!\")\n```\n\n### for și range()\n\n```python run\nfor fruit in [\"apple\", \"banana\"]:\n    print(\"I like\", fruit)\nfor letter in \"Hey\":\n    print(letter)\nfor i in range(3):\n    print(\"Step\", i)\n```\n\n`range()` generează numere. **Valoarea `stop` nu este inclusă niciodată.**\n\n| Apel | Valori |\n|---|---|\n| `range(5)` | 0, 1, 2, 3, 4 |\n| `range(1, 6)` | 1, 2, 3, 4, 5 |\n| `range(0, 10, 2)` | 0, 2, 4, 6, 8 |\n| `range(10, 0, -3)` | 10, 7, 4, 1 |\n\n```python run\nprint(list(range(5)))\nprint(list(range(2, 10, 3)))\nprint(list(range(5, 0, -2)))\ntotal = 0\nfor n in range(1, 101):\n    total += n\nprint(\"Sum 1..100:\", total)\n```\n\n### break, continue, pass\n\n`break` iese din buclă. `continue` sare peste restul iterației curente. `pass` nu face nimic (loc rezervat).\n\n```python run\nfor n in range(1, 8):\n    if n % 2 == 0:\n        continue          # skip even numbers\n    if n > 5:\n        break             # stop the whole loop\n    print(n)\n```\n\n```python run\n# a classic: ask until the answer is right\nanswers = [\"no\", \"maybe\", \"yes\"]\ni = 0\nwhile True:\n    reply = answers[i]\n    i += 1\n    if reply == \"yes\":\n        break\n    print(\"Not yet:\", reply)\nprint(\"Done after\", i, \"tries\")\n```\n\n### Bucle imbricate\n\nO buclă în interiorul altei bucle: bucla interioară se reia complet la fiecare pas al celei exterioare.\n\n```python run\nfor i in range(1, 4):\n    for j in range(i):\n        print(\"*\", end=\"\")\n    print()               # new line after each row\ncount = 0\nfor a in range(3):\n    for b in range(4):\n        count += 1\nprint(count)              # 3 * 4 = 12\n```\n\n### Modificarea unei liste în timpul parcurgerii\n\n> warn: Nu șterge elemente dintr-o listă în timp ce o parcurgi: unele elemente vor fi sărite. Parcurge o copie (`for x in lst[:]`) sau construiește o listă nouă.\n\n```python run\nnums = [1, 2, 3, 4, 5, 6]\nfor n in nums:\n    if n % 2 == 0:\n        nums.remove(n)\nprint(nums)               # surprise: not [1, 3, 5]\nnums = [1, 2, 3, 4, 5, 6]\nfor n in nums[:]:\n    if n % 2 == 0:\n        nums.remove(n)\nprint(nums)\n```\n", "en": "A loop repeats a block of code. Python has two kinds: `while` (as long as a condition is true) and `for` (for each item in a sequence).\n\n### while\n\nYou must **change something inside the loop** so the condition eventually becomes false. Otherwise the loop runs forever (an infinite loop).\n\n```python run\ncountdown = 3\nwhile countdown > 0:\n    print(\"Countdown:\", countdown)\n    countdown -= 1      # without this line the loop never ends\nprint(\"Go!\")\n```\n\n### for and range()\n\n```python run\nfor fruit in [\"apple\", \"banana\"]:\n    print(\"I like\", fruit)\nfor letter in \"Hey\":\n    print(letter)\nfor i in range(3):\n    print(\"Step\", i)\n```\n\n`range()` generates numbers. **The `stop` value is never included.**\n\n| Call | Values |\n|---|---|\n| `range(5)` | 0, 1, 2, 3, 4 |\n| `range(1, 6)` | 1, 2, 3, 4, 5 |\n| `range(0, 10, 2)` | 0, 2, 4, 6, 8 |\n| `range(10, 0, -3)` | 10, 7, 4, 1 |\n\n```python run\nprint(list(range(5)))\nprint(list(range(2, 10, 3)))\nprint(list(range(5, 0, -2)))\ntotal = 0\nfor n in range(1, 101):\n    total += n\nprint(\"Sum 1..100:\", total)\n```\n\n### break, continue, pass\n\n`break` exits the loop. `continue` skips the rest of the current iteration. `pass` does nothing (a placeholder).\n\n```python run\nfor n in range(1, 8):\n    if n % 2 == 0:\n        continue          # skip even numbers\n    if n > 5:\n        break             # stop the whole loop\n    print(n)\n```\n\n```python run\n# a classic: ask until the answer is right\nanswers = [\"no\", \"maybe\", \"yes\"]\ni = 0\nwhile True:\n    reply = answers[i]\n    i += 1\n    if reply == \"yes\":\n        break\n    print(\"Not yet:\", reply)\nprint(\"Done after\", i, \"tries\")\n```\n\n### Nested loops\n\nA loop inside another loop: the inner loop restarts completely at every step of the outer one.\n\n```python run\nfor i in range(1, 4):\n    for j in range(i):\n        print(\"*\", end=\"\")\n    print()               # new line after each row\ncount = 0\nfor a in range(3):\n    for b in range(4):\n        count += 1\nprint(count)              # 3 * 4 = 12\n```\n\n### Changing a list while looping over it\n\n> warn: Do not delete items from a list while looping over it: some items will be skipped. Loop over a copy (`for x in lst[:]`) or build a new list.\n\n```python run\nnums = [1, 2, 3, 4, 5, 6]\nfor n in nums:\n    if n % 2 == 0:\n        nums.remove(n)\nprint(nums)               # surprise: not [1, 3, 5]\nnums = [1, 2, 3, 4, 5, 6]\nfor n in nums[:]:\n    if n % 2 == 0:\n        nums.remove(n)\nprint(nums)\n```\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "for i in range(2, 10, 3):\n    print(i, end=\" \")\n", "options": ["2 5 8", "2 5 8 10", "3 6 9", "2 4 6 8"], "answer": 0, "verify": "out", "expl": {"ro": "Pornește de la 2 și crește cu 3: 2, 5, 8. Următorul, 11, depășește stop-ul 10.", "en": "It starts at 2 and grows by 3: 2, 5, 8. The next one, 11, passes the stop value 10."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(list(range(5, 0, -2)))\n", "options": ["[5, 3, 1]", "[5, 3, 1, -1]", "[4, 2]", "[5, 4, 3, 2, 1]"], "mono": true, "answer": 0, "verify": "out", "expl": {"ro": "Pasul negativ numără în jos; 0 (stop) nu este inclus.", "en": "A negative step counts down; 0 (stop) is not included."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "for n in range(1, 8):\n    if n % 2 == 0:\n        continue\n    if n > 5:\n        break\n    print(n, end=\" \")\n", "options": ["1 3 5", "1 3 5 7", "2 4 6", "1 2 3 4 5"], "answer": 0, "verify": "out", "expl": {"ro": "Numerele pare sunt sărite cu `continue`; la 7 se execută `break`, deci 7 nu se afișează.", "en": "Even numbers are skipped with `continue`; at 7 `break` runs, so 7 is not printed."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "n = 1\nwhile n < 20:\n    n *= 2\nprint(n)\n", "options": ["16", "20", "32", "40"], "answer": 2, "verify": "out", "expl": {"ro": "n devine 2, 4, 8, 16, 32. La 16 condiția `n < 20` încă e adevărată, apoi n = 32 o face falsă.", "en": "n becomes 2, 4, 8, 16, 32. At 16 the condition `n < 20` is still true, then n = 32 makes it false."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "count = 0\nfor i in range(3):\n    for j in range(4):\n        count += 1\nprint(count)\n", "options": ["7", "12", "3", "4"], "answer": 1, "verify": "out", "expl": {"ro": "Bucla interioară rulează de 4 ori la fiecare din cei 3 pași exteriori: 3 × 4 = 12.", "en": "The inner loop runs 4 times at each of the 3 outer steps: 3 × 4 = 12."}}, {"type": "order", "q": {"ro": "Ordonează liniile ca programul să afișeze 3, 2, 1 și apoi Go.", "en": "Put the lines in order so the program prints 3, 2, 1 and then Go."}, "lines": ["n = 3", "while n > 0:", "    print(n)", "    n -= 1", "print(\"Go\")"], "expect": "3\n2\n1\nGo", "expl": {"ro": "Variabila se creează înainte de buclă; în buclă afișezi și apoi scazi; `print(\"Go\")` urmează după buclă, fără indentare.", "en": "The variable is created before the loop; inside the loop you print and then decrease; `print(\"Go\")` comes after the loop, not indented."}}], "exercises": [{"title": {"ro": "Tabla înmulțirii", "en": "Multiplication table"}, "task": {"ro": "Citește un număr întreg `n`. Afișează tabla înmulțirii cu `n` de la 1 la 12, câte o linie, în forma `7 x 3 = 21`.\n", "en": "Read a whole number `n`. Print the multiplication table of `n` from 1 to 12, one line each, in the form `7 x 3 = 21`.\n"}, "starter": "n = int(input())\n# loop from 1 to 12\n", "hint": {"ro": "`for i in range(1, 13):` și `print(f\"{n} x {i} = {n * i}\")`.", "en": "`for i in range(1, 13):` and `print(f\"{n} x {i} = {n * i}\")`."}, "demoInput": ["7"], "solution": "n = int(input())\nfor i in range(1, 13):\n    print(f\"{n} x {i} = {n * i}\")\n", "tests": [{"stdin": ["7"], "last": 12, "expect": "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70\n7 x 11 = 77\n7 x 12 = 84"}, {"stdin": ["2"], "last": 2, "expect": "2 x 11 = 22\n2 x 12 = 24", "hidden": true}]}, {"title": {"ro": "Suma numerelor pare", "en": "Sum of even numbers"}, "task": {"ro": "Completează `sum_even(limit)`: returnează suma numerelor pare de la 1 până la `limit`, inclusiv `limit`.\n", "en": "Complete `sum_even(limit)`: return the sum of the even numbers from 1 up to `limit`, including `limit`.\n"}, "starter": "def sum_even(limit):\n    pass\n", "hint": {"ro": "`range(2, limit + 1, 2)` generează exact numerele pare.", "en": "`range(2, limit + 1, 2)` generates exactly the even numbers."}, "solution": "def sum_even(limit):\n    total = 0\n    for n in range(2, limit + 1, 2):\n        total += n\n    return total\n", "tests": [{"append": "print(sum_even(10), sum_even(1), sum_even(100))", "expect": "30 0 2550"}, {"append": "print(sum_even(11), sum_even(2))", "expect": "30 2", "hidden": true}]}, {"title": {"ro": "FizzBuzz", "en": "FizzBuzz"}, "task": {"ro": "Pentru numerele de la 1 la 15 afișează câte o linie: `FizzBuzz` dacă numărul se împarte la 3 și la 5, `Fizz` dacă se împarte doar la 3, `Buzz` dacă se împarte doar la 5, altfel numărul.\n", "en": "For the numbers from 1 to 15 print one line each: `FizzBuzz` if the number is divisible by 3 and 5, `Fizz` if only by 3, `Buzz` if only by 5, otherwise the number.\n"}, "starter": "# numbers from 1 to 15\n", "hint": {"ro": "Verifică întâi cazul `% 15 == 0`, apoi `% 3`, apoi `% 5`.", "en": "Check the `% 15 == 0` case first, then `% 3`, then `% 5`."}, "solution": "for i in range(1, 16):\n    if i % 15 == 0:\n        print(\"FizzBuzz\")\n    elif i % 3 == 0:\n        print(\"Fizz\")\n    elif i % 5 == 0:\n        print(\"Buzz\")\n    else:\n        print(i)\n", "tests": [{"expect": "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"}]}, {"title": {"ro": "Triunghiul de stele", "en": "Star triangle"}, "task": {"ro": "Citește un număr `n` și afișează un triunghi cu `n` rânduri: primul rând are o stea, al doilea două și așa mai departe. Pentru `n = 4` rezultatul este `*`, `**`, `***`, `****` (fiecare pe linia lui).\n", "en": "Read a number `n` and print a triangle with `n` rows: the first row has one star, the second two, and so on. For `n = 4` the result is `*`, `**`, `***`, `****` (each on its own line).\n"}, "starter": "n = int(input())\n# nested loops or string repetition\n", "hint": {"ro": "`for i in range(1, n + 1): print(\"*\" * i)` sau cu bucle imbricate și `end=\"\"`.", "en": "`for i in range(1, n + 1): print(\"*\" * i)` or with nested loops and `end=\"\"`."}, "demoInput": ["4"], "solution": "n = int(input())\nfor i in range(1, n + 1):\n    for j in range(i):\n        print(\"*\", end=\"\")\n    print()\n", "tests": [{"stdin": ["4"], "last": 4, "expect": "*\n**\n***\n****"}, {"stdin": ["2"], "last": 2, "expect": "*\n**", "hidden": true}]}]}, {"id": "l10", "n": 11, "part": 2, "domain": 4, "title": {"ro": "Funcții", "en": "Functions"}, "goal": {"ro": "Să definești și să apelezi funcții cu parametri, valori implicite și return, și să explici domeniul de vizibilitate al variabilelor.", "en": "Define and call functions with parameters, default values and return, and explain variable scope."}, "theory": {"ro": "O funcție este un bloc de cod cu nume, scris o dată și folosit de câte ori ai nevoie. Se definește cu `def`, urmat de nume, paranteze și `:`. **O funcție trebuie definită înaintea primului apel.**\n\n```python run\ndef greet():\n    print(\"Hello, learner!\")\n\ngreet()\ngreet()\n```\n\n### Parametri și argumente\n\n```python run\ndef greet(name, subject=\"Python\"):     # subject has a default value\n    print(f\"Hello, {name}! Ready to study {subject}?\")\n\ngreet(\"Alex\")                  # uses the default\ngreet(\"Mia\", \"Maths\")          # positional arguments\ngreet(subject=\"Biology\", name=\"Sam\")   # keyword arguments\n```\n\n> exam: Parametrii cu valoare implicită se pun **după** cei fără valoare implicită. Argumentele date după nume (`subject=\"Biology\"`) pot veni în orice ordine.\n\n### return versus print\n\n`print()` doar **afișează**. `return` **trimite o valoare înapoi** celui care a apelat funcția și încheie funcția. O funcție fără `return` returnează `None`.\n\n```python run\ndef add(a, b):\n    return a + b\n\nresult = add(10, 5)\nprint(\"Sum:\", result)\n\ndef say_hi():\n    print(\"hi\")\n\nvalue = say_hi()\nprint(value)         # None: say_hi has no return\n```\n\n### Mai multe valori returnate\n\nPoți returna mai multe valori; ele formează un tuplu pe care îl poți despacheta.\n\n```python run\ndef min_max(a, b):\n    return min(a, b), max(a, b)\n\nlo, hi = min_max(9, 4)\nprint(lo, hi)\nprint(min_max(9, 4))\n```\n\n### Funcții care returnează True/False\n\n```python run\ndef is_even(n):\n    return n % 2 == 0\n\nprint(is_even(4), is_even(7))\nif is_even(10):\n    print(\"ten is even\")\n```\n\n### Domeniul de vizibilitate (scope)\n\nO variabilă creată într-o funcție este **locală**: există doar acolo. O variabilă creată în afara funcțiilor este **globală**. O atribuire în funcție creează o variabilă locală nouă, chiar dacă există una globală cu același nume. Ca să modifici o variabilă globală, scrii `global nume`.\n\n```python run\nx = 10\n\ndef change_local():\n    x = 5           # a new local x\n\ndef change_global():\n    global x\n    x = 5           # changes the global x\n\nchange_local()\nprint(x)\nchange_global()\nprint(x)\n```\n\n```python run err\ndef make_secret():\n    secret = 42\n\nmake_secret()\nprint(secret)\n```\n\n> tip: În general e mai curat să pasezi valori ca parametri și să returnezi rezultate decât să folosești `global`.\n\n### O funcție care se apelează pe ea însăși (recursivitate)\n\n```python run\ndef factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))\n```\n\n### Ordinea contează\n\n```python run err\nprint(add(1, 2))\n\ndef add(a, b):\n    return a + b\n```\n", "en": "A function is a named block of code, written once and used as many times as you need. It is defined with `def`, followed by the name, parentheses and `:`. **A function must be defined before its first call.**\n\n```python run\ndef greet():\n    print(\"Hello, learner!\")\n\ngreet()\ngreet()\n```\n\n### Parameters and arguments\n\n```python run\ndef greet(name, subject=\"Python\"):     # subject has a default value\n    print(f\"Hello, {name}! Ready to study {subject}?\")\n\ngreet(\"Alex\")                  # uses the default\ngreet(\"Mia\", \"Maths\")          # positional arguments\ngreet(subject=\"Biology\", name=\"Sam\")   # keyword arguments\n```\n\n> exam: Parameters with a default value come **after** those without one. Arguments given by name (`subject=\"Biology\"`) can come in any order.\n\n### return versus print\n\n`print()` only **displays**. `return` **sends a value back** to whoever called the function and ends the function. A function without `return` returns `None`.\n\n```python run\ndef add(a, b):\n    return a + b\n\nresult = add(10, 5)\nprint(\"Sum:\", result)\n\ndef say_hi():\n    print(\"hi\")\n\nvalue = say_hi()\nprint(value)         # None: say_hi has no return\n```\n\n### Returning several values\n\nYou can return several values; they form a tuple that you can unpack.\n\n```python run\ndef min_max(a, b):\n    return min(a, b), max(a, b)\n\nlo, hi = min_max(9, 4)\nprint(lo, hi)\nprint(min_max(9, 4))\n```\n\n### Functions that return True/False\n\n```python run\ndef is_even(n):\n    return n % 2 == 0\n\nprint(is_even(4), is_even(7))\nif is_even(10):\n    print(\"ten is even\")\n```\n\n### Scope\n\nA variable created inside a function is **local**: it exists only there. A variable created outside functions is **global**. An assignment inside a function creates a new local variable, even if a global one has the same name. To change a global variable you write `global name`.\n\n```python run\nx = 10\n\ndef change_local():\n    x = 5           # a new local x\n\ndef change_global():\n    global x\n    x = 5           # changes the global x\n\nchange_local()\nprint(x)\nchange_global()\nprint(x)\n```\n\n```python run err\ndef make_secret():\n    secret = 42\n\nmake_secret()\nprint(secret)\n```\n\n> tip: In general it is cleaner to pass values as parameters and return results than to use `global`.\n\n### A function that calls itself (recursion)\n\n```python run\ndef factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))\n```\n\n### Order matters\n\n```python run err\nprint(add(1, 2))\n\ndef add(a, b):\n    return a + b\n```\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "def f():\n    print(\"hi\")\n\nx = f()\nprint(x)\n", "options": ["hi", "hi\nNone", "None", "hi\nhi"], "answer": 1, "verify": "out", "expl": {"ro": "Funcția afișează `hi`, dar nu are `return`, deci `x` este `None`.", "en": "The function prints `hi`, but it has no `return`, so `x` is `None`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "def power(base, exp=2):\n    return base ** exp\n\nprint(power(3), power(exp=3, base=2))\n", "options": ["9 8", "6 6", "9 9", "3 2"], "answer": 0, "verify": "out", "expl": {"ro": "`power(3)` folosește `exp=2` implicit: 9. Cu argumente după nume, ordinea nu contează: `2 ** 3 = 8`.", "en": "`power(3)` uses the default `exp=2`: 9. With keyword arguments the order does not matter: `2 ** 3 = 8`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "x = 10\n\ndef change():\n    x = 5\n\nchange()\nprint(x)\n", "options": ["5", "10", "15", "Error"], "answer": 1, "verify": "out", "expl": {"ro": "Atribuirea din funcție creează un `x` local nou. `x`-ul global rămâne 10.", "en": "The assignment in the function creates a new local `x`. The global `x` stays 10."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?" rul cu funcții", "en": "Calculator functions"}, "task": {"ro": "Scrie patru funcții: `add(a, b)`, `subtract(a, b)`, `multiply(a, b)` și `divide(a, b)`. Fiecare **returnează** rezultatul (nu îl afișează).\n", "en": "Write four functions: `add(a, b)`, `subtract(a, b)`, `multiply(a, b)` and `divide(a, b)`. Each one **returns** the result (it does not print it).\n"}, "starter": "def add(a, b):\n    pass\n\n# write subtract, multiply and divide as well\n", "hint": {"ro": "Fiecare funcție are o singură linie: `return a + b`, `return a - b` și așa mai departe.", "en": "Each function is one line: `return a + b`, `return a - b` and so on."}, "solution": "def add(a, b):\n    return a + b\n\ndef subtract(a, b):\n    return a - b\n\ndef multiply(a, b):\n    return a * b\n\ndef divide(a, b):\n    return a / b\n", "tests": [{"append": "print(add(2, 3), subtract(10, 4), multiply(3, 5), divide(9, 2))", "expect": "5 6 15 4.5"}, {"append": "print(add(-1, 1), multiply(0, 7), divide(1, 4))", "expect": "0 0 0.25", "hidden": true}]}, {"title": {"ro": "Formatorul de nume", "en": "Name formatter"}, "task": {"ro": "Scrie `format_name(first, last)`: returnează numele complet cu litere mari la început de cuvânt (`\"ana POP\"` devine `\"Ana Pop\"`). Scrie și `initials(first, last)`: returnează inițialele în forma `A.P.`\n", "en": "Write `format_name(first, last)`: return the full name with a capital at the start of each word (`\"ana POP\"` becomes `\"Ana Pop\"`). Also write `initials(first, last)`: return the initials in the form `A.P.`\n"}, "starter": "def format_name(first, last):\n    pass\n\ndef initials(first, last):\n    pass\n", "hint": {"ro": "`(first + \" \" + last).title()` și `first[0].upper() + \".\" + last[0].upper() + \".\"`.", "en": "`(first + \" \" + last).title()` and `first[0].upper() + \".\" + last[0].upper() + \".\"`."}, "solution": "def format_name(first, last):\n    return (first + \" \" + last).title()\n\ndef initials(first, last):\n    return first[0].upper() + \".\" + last[0].upper() + \".\"\n", "tests": [{"append": "print(format_name('ana', 'POP'))\nprint(initials('ana', 'pop'))", "expect": "Ana Pop\nA.P."}, {"append": "print(format_name('MIHAI', 'rusu'), initials('mihai', 'rusu'))", "expect": "Mihai Rusu M.R.", "hidden": true}]}, {"title": {"ro": "Număr prim?", "en": "Prime number?"}, "task": {"ro": "Scrie `is_prime(n)`: returnează `True` dacă `n` este prim (se împarte doar la 1 și la el însuși) și `False` altfel. Numerele sub 2 nu sunt prime.\n", "en": "Write `is_prime(n)`: return `True` if `n` is prime (divisible only by 1 and itself) and `False` otherwise. Numbers below 2 are not prime.\n"}, "starter": "def is_prime(n):\n    pass\n", "hint": {"ro": "Dacă `n < 2` returnează `False`. Apoi încearcă fiecare `d` din `range(2, n)`: dacă `n % d == 0`, returnează `False`. La final `True`.", "en": "If `n < 2` return `False`. Then try each `d` in `range(2, n)`: if `n % d == 0`, return `False`. At the end `True`."}, "solution": "def is_prime(n):\n    if n < 2:\n        return False\n    for d in range(2, n):\n        if n % d == 0:\n            return False\n    return True\n", "tests": [{"append": "print(is_prime(2), is_prime(15), is_prime(17), is_prime(1))", "expect": "True False True False"}, {"append": "print(is_prime(0), is_prime(97), is_prime(91))", "expect": "False True False", "hidden": true}]}, {"title": {"ro": "Valoare implicită", "en": "Default value"}, "task": {"ro": "Scrie `volume(length, width=1, height=1)`: returnează `length * width * height`. Apelat cu un singur argument, returnează lungimea.\n", "en": "Write `volume(length, width=1, height=1)`: return `length * width * height`. Called with a single argument, it returns the length.\n"}, "starter": "def volume(length):\n    return length\n", "hint": {"ro": "Adaugă parametrii `width=1` și `height=1` și înmulțește-i.", "en": "Add the parameters `width=1` and `height=1` and multiply them."}, "solution": "def volume(length, width=1, height=1):\n    return length * width * height\n", "tests": [{"append": "print(volume(5), volume(2, 3), volume(2, 3, 4), volume(2, height=5))", "expect": "5 6 24 10"}]}]}, {"id": "l11", "n": 12, "part": 2, "domain": 4, "added": true, "title": {"ro": "Documentarea codului", "en": "Documenting code"}, "goal": {"ro": "Să documentezi codul cu comentarii și docstring-uri, să respecți regulile de spațiere și indentare și să știi la ce folosește pydoc.", "en": "Document code with comments and docstrings, follow spacing and indentation rules, and know what pydoc is for."}, "theory": {"ro": "> new: Obiectivul 4.1 al examenului (documentarea codului) nu era în materialele inițiale. Întrebările sunt de obicei scurte și ușor de câștigat dacă ții minte regulile de mai jos.\n\n### Comentarii\n\nUn comentariu începe cu `#` și ține până la sfârșitul liniei. Explică **de ce** face codul ceva, nu repetă **ce** face.\n\n```python run\n# Convert the price from euros to lei\nprice_lei = 5 * 4.97   # 4.97 is an approximate rate\nprint(round(price_lei, 2))\n```\n\n### Docstring: documentația unei funcții\n\nUn **docstring** este un text între trei ghilimele, scris ca **prima instrucțiune** din funcție, clasă sau modul. Python îl păstrează și îl poți citi cu `__doc__` sau `help()`.\n\n```python run\ndef area(width, height):\n    \"\"\"Return the area of a rectangle.\n\n    width and height must be numbers.\n    \"\"\"\n    return width * height\n\nprint(area.__doc__)\nprint(area(3, 4))\n```\n\n```python run\ndef square(n):\n    \"\"\"Return n squared.\"\"\"\n    return n * n\n\nhelp(square)\n```\n\n> exam: Docstring-ul este prima instrucțiune din corpul funcției, între `\"\"\"...\"\"\"`. Un comentariu `#` pus înaintea lui `def` **nu** este docstring și nu apare în `help()`.\n\n### pydoc\n\n`pydoc` este instrumentul din biblioteca standard care generează documentație din docstring-uri. Din terminal: `python -m pydoc math` afișează documentația modulului `math`, iar `python -m pydoc -w math` o salvează ca fișier HTML. În cod, `help(obiect)` face același lucru.\n\n### Indentare și spațiere\n\n- Folosește **4 spații** pe nivel de indentare. Important: același număr de spații în tot blocul.\n- Nu amesteca tab-uri cu spații în același fișier (poate da `TabError` sau `IndentationError`).\n- Pune câte un spațiu în jurul operatorilor (`a + b`, `x = 5`) și după virgulă.\n- Două linii goale între funcții, o linie goală pentru a separa idei în interiorul unei funcții.\n- Nume în `snake_case` pentru variabile și funcții (`total_price`), `PascalCase` pentru clase.\n- O linie lungă se poate continua în paranteze sau cu `\\` la sfârșit.\n\n```python run\ntotal = (1 + 2 +\n         3 + 4)\nlong_text = (\"Python reads \"\n             \"like English\")\nprint(total, long_text)\n```\n\n```python run err\ndef f():\n    x = 1\n      y = 2\n```\n\nEroarea de mai sus este `IndentationError: unexpected indent`: a doua linie are mai multe spații decât prima din același bloc.\n\n### pass: bloc gol\n\nUn bloc nu poate fi gol. Când vrei să-l completezi mai târziu, scrie `pass`.\n\n```python run\ndef todo():\n    pass            # to be written later\n\nprint(todo())\n```\n", "en": "> new: Exam objective 4.1 (documenting code) was not in the original materials. The questions are usually short and easy to win if you remember the rules below.\n\n### Comments\n\nA comment starts with `#` and lasts until the end of the line. It explains **why** the code does something, not **what** it does.\n\n```python run\n# Convert the price from euros to lei\nprice_lei = 5 * 4.97   # 4.97 is an approximate rate\nprint(round(price_lei, 2))\n```\n\n### Docstrings: the documentation of a function\n\nA **docstring** is text between triple quotes, written as the **first statement** inside a function, class or module. Python keeps it and you can read it with `__doc__` or `help()`.\n\n```python run\ndef area(width, height):\n    \"\"\"Return the area of a rectangle.\n\n    width and height must be numbers.\n    \"\"\"\n    return width * height\n\nprint(area.__doc__)\nprint(area(3, 4))\n```\n\n```python run\ndef square(n):\n    \"\"\"Return n squared.\"\"\"\n    return n * n\n\nhelp(square)\n```\n\n> exam: The docstring is the first statement in the function body, between `\"\"\"...\"\"\"`. A `#` comment placed before `def` is **not** a docstring and does not show up in `help()`.\n\n### pydoc\n\n`pydoc` is the standard-library tool that generates documentation from docstrings. From a terminal: `python -m pydoc math` shows the documentation of the `math` module, and `python -m pydoc -w math` saves it as an HTML file. In code, `help(object)` does the same thing.\n\n### Indentation and spacing\n\n- Use **4 spaces** per indentation level. What matters: the same number of spaces throughout the block.\n- Do not mix tabs and spaces in the same file (it can cause `TabError` or `IndentationError`).\n- Put one space around operators (`a + b`, `x = 5`) and after commas.\n- Two blank lines between functions, one blank line to separate ideas inside a function.\n- Use `snake_case` for variables and functions (`total_price`), `PascalCase` for classes.\n- A long line can be continued inside parentheses or with `\\` at the end.\n\n```python run\ntotal = (1 + 2 +\n         3 + 4)\nlong_text = (\"Python reads \"\n             \"like English\")\nprint(total, long_text)\n```\n\n```python run err\ndef f():\n    x = 1\n      y = 2\n```\n\nThe error above is `IndentationError: unexpected indent`: the second line has more spaces than the first in the same block.\n\n### pass: an empty block\n\nA block cannot be empty. When you want to fill it in later, write `pass`.\n\n```python run\ndef todo():\n    pass            # to be written later\n\nprint(todo())\n```\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "def f():\n    \"\"\"Return one.\"\"\"\n    return 1\n\nprint(f.__doc__)\n", "options": ["Return one.", "1", "None", "f"], "answer": 0, "verify": "out", "expl": {"ro": "`__doc__` conține textul docstring-ului, adică prima instrucțiune din funcție.", "en": "`__doc__` holds the docstring text, which is the first statement in the function."}}, {"type": "mcq", "q": {"ro": "Care instrument generează documentație din docstring-uri?", "en": "Which tool generates documentation from docstrings?"}, "options": ["pydoc", "pip", "venv", "idle"], "mono": true, "answer": 0, "expl": {"ro": "`pydoc` citește docstring-urile; `python -m pydoc -w modul` creează un fișier HTML.", "en": "`pydoc` reads docstrings; `python -m pydoc -w module` creates an HTML file."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul?", "en": "What error does the code produce?"}, "code": "def f():\n    x = 1\n      y = 2\n", "options": ["IndentationError", "SyntaxError", "NameError", "TabError"], "answer": 0, "verify": "err", "expl": {"ro": "Linia a doua are indentare mai mare fără motiv: `IndentationError: unexpected indent`.", "en": "The second line has extra indentation for no reason: `IndentationError: unexpected indent`."}}, {"type": "order", "q": {"ro": "Ordonează liniile ca funcția să aibă docstring corect și programul să afișeze textul lui.", "en": "Order the lines so the function has a correct docstring and the program prints its text."}, "lines": ["def square(n):", "    \"\"\"Return n squared.\"\"\"", "    return n * n", "print(square.__doc__)"], "expect": "Return n squared.", "expl": {"ro": "Docstring-ul este prima instrucțiune din corpul funcției, imediat sub `def`.", "en": "The docstring is the first statement in the function body, right below `def`."}}, {"type": "yesno", "q": {"ro": "Alege Da sau Nu pentru fiecare afirmație.", "en": "Choose Yes or No for each statement."}, "items": [{"t": {"ro": "Un docstring este prima instrucțiune dintr-o funcție, scrisă între trei ghilimele.", "en": "A docstring is the first statement in a function, written between triple quotes."}, "ans": true}, {"t": {"ro": "Python execută textul din comentarii.", "en": "Python executes the text in comments."}, "ans": false}, {"t": {"ro": "Poți amesteca liber tab-uri și spații în același bloc.", "en": "You can freely mix tabs and spaces in the same block."}, "ans": false}, {"t": {"ro": "Un bloc `def` poate conține doar `pass` dacă nu vrei încă să-l completezi.", "en": "A `def` block can contain only `pass` if you do not want to fill it in yet."}, "ans": true}, {"t": {"ro": "Convenția pentru numele variabilelor și funcțiilor este `snake_case`.", "en": "The convention for variable and function names is `snake_case`."}, "ans": true}], "expl": {"ro": "Comentariile sunt ignorate; amestecul de tab-uri și spații produce erori; `pass` ține locul unui bloc gol.", "en": "Comments are ignored; mixing tabs and spaces causes errors; `pass` holds the place of an empty block."}}], "exercises": [{"title": {"ro": "Adaugă un docstring", "en": "Add a docstring"}, "task": {"ro": "Funcția `area` nu are documentație. Adaugă un docstring care să fie exact `Return the area of a rectangle.` (un singur rând, între trei ghilimele duble).\n", "en": "The function `area` has no documentation. Add a docstring that is exactly `Return the area of a rectangle.` (a single line, between triple double quotes).\n"}, "starter": "def area(width, height):\n    return width * height\n", "hint": {"ro": "Pune `\"\"\"Return the area of a rectangle.\"\"\"` pe prima linie din corpul funcției.", "en": "Put `\"\"\"Return the area of a rectangle.\"\"\"` on the first line of the function body."}, "solution": "def area(width, height):\n    \"\"\"Return the area of a rectangle.\"\"\"\n    return width * height\n", "tests": [{"append": "print(area.__doc__)\nprint(area(3, 4))", "expect": "Return the area of a rectangle.\n12"}]}, {"title": {"ro": "Repară indentarea", "en": "Fix the indentation"}, "task": {"ro": "Codul dă `IndentationError`. Repară-l ca să afișeze `6`.\n", "en": "The code gives an `IndentationError`. Fix it so it prints `6`.\n"}, "starter": "def total(numbers):\n    result = 0\n    for n in numbers:\n        result += n\n      return result\n\nprint(total([1, 2, 3]))\n", "hint": {"ro": "Linia cu `return` trebuie să înceapă la același nivel ca `result = 0` (4 spații).", "en": "The `return` line must start at the same level as `result = 0` (4 spaces)."}, "solution": "def total(numbers):\n    result = 0\n    for n in numbers:\n        result += n\n    return result\n\nprint(total([1, 2, 3]))\n", "tests": [{"expect": "6"}]}, {"title": {"ro": "Funcție documentată", "en": "A documented function"}, "task": {"ro": "Scrie `describe(name)`: returnează textul `Hi, ` urmat de nume (de exemplu `Hi, Ana`). Funcția trebuie să aibă un docstring.\n", "en": "Write `describe(name)`: return the text `Hi, ` followed by the name (for example `Hi, Ana`). The function must have a docstring.\n"}, "starter": "def describe(name):\n    pass\n", "hint": {"ro": "Docstring pe prima linie, apoi `return \"Hi, \" + name`.", "en": "Docstring on the first line, then `return \"Hi, \" + name`."}, "solution": "def describe(name):\n    \"\"\"Return a short greeting for name.\"\"\"\n    return \"Hi, \" + name\n", "tests": [{"append": "print(describe('Ana'))\nprint(describe.__doc__ is not None)", "expect": "Hi, Ana\nTrue"}]}]}, {"id": "l12", "n": 13, "part": 3, "domain": 3, "title": {"ro": "Fișiere: citire și scriere", "en": "Files: reading and writing"}, "goal": {"ro": "Să deschizi fișiere în modul potrivit, să citești și să scrii cu with și să muți cursorul cu seek().", "en": "Open files in the right mode, read and write with `with`, and move the cursor with seek()."}, "theory": {"ro": "Programele păstrează date între rulări în **fișiere**. Mai întâi deschizi fișierul cu `open(nume, mod)`, apoi citești sau scrii. Cea mai sigură formă este `with`, care **închide fișierul automat**, chiar dacă apare o eroare.\n\n> tip: Fișierele create în blocurile de aici există doar cât rulează programul și sunt șterse la următoarea rulare. Pe calculatorul tău, ele apar în folderul programului.\n\n### Modurile de deschidere\n\n| Mod | Înseamnă | Fișierul nu există | Fișierul există |\n|---|---|---|---|\n| `\"r\"` | citire (implicit) | eroare | citește de la început |\n| `\"w\"` | scriere | îl creează | **șterge tot conținutul** |\n| `\"a\"` | adăugare | îl creează | adaugă la sfârșit |\n| `\"x\"` | creare exclusivă | îl creează | eroare |\n| `\"r+\"` | citire și scriere | eroare | păstrează conținutul |\n| `\"w+\"` | scriere și citire | îl creează | șterge tot, apoi poți citi |\n| `\"a+\"` | adăugare și citire | îl creează | scrie la sfârșit, poți citi |\n\n### Scriere și adăugare\n\n```python run\nwith open(\"diary.txt\", \"w\") as f:\n    f.write(\"Day 1: started Python.\\n\")\n    f.write(\"Day 2: learned loops.\\n\")\n\nwith open(\"diary.txt\", \"a\") as f:\n    f.write(\"Day 3: files!\\n\")\n\nwith open(\"diary.txt\") as f:\n    print(f.read())\n```\n\n> exam: `write()` **nu** adaugă linie nouă singur: scrie `\\n` unde ai nevoie. Modul `\"w\"` șterge conținutul vechi, iar `\"a\"` îl păstrează.\n\n### Citire\n\n```python run\nwith open(\"nums.txt\", \"w\") as f:\n    f.write(\"10\\n20\\n30\\n\")\n\nwith open(\"nums.txt\") as f:\n    first = f.readline()        # one line, including the \\n\n    print(repr(first))\n    rest = f.readlines()        # list of the remaining lines\n    print(rest)\n\ntotal = 0\nwith open(\"nums.txt\") as f:\n    for line in f:              # loop line by line\n        total += int(line.strip())\nprint(total)\n```\n\n- `read()` citește tot fișierul ca un singur text.\n- `readline()` citește o linie.\n- `readlines()` citește toate liniile într-o listă.\n- `for line in f:` parcurge liniile una câte una. `strip()` scoate `\\n`-ul de la capăt.\n\n### Cursorul și seek()\n\nPython ține minte unde ești în fișier. După ce scrii, cursorul este la sfârșit; dacă citești imediat, nu primești nimic. `seek(0)` îl duce la început, iar `tell()` arată poziția.\n\n```python run\nwith open(\"note.txt\", \"w+\") as f:\n    f.write(\"Saved!\")\n    print(repr(f.read()))     # nothing: the cursor is at the end\n    f.seek(0)\n    print(f.read())\n    print(f.tell())\n```\n\n### Fișierul se închide singur\n\n```python run\nwith open(\"a.txt\", \"w\") as f:\n    f.write(\"x\")\nprint(f.closed)\n```\n\nDacă nu folosești `with`, trebuie să apelezi tu `f.close()`. Un fișier care nu există, deschis cu `\"r\"`, dă `FileNotFoundError` (vezi lecția despre excepții).\n\n```python run err\nwith open(\"ghost.txt\", \"r\") as f:\n    print(f.read())\n```\n", "en": "Programs keep data between runs in **files**. First you open the file with `open(name, mode)`, then you read or write. The safest form is `with`, which **closes the file automatically**, even if an error occurs.\n\n> tip: Files created in the blocks here exist only while the program runs and are erased on the next run. On your own computer, they appear in the program's folder.\n\n### Opening modes\n\n| Mode | Meaning | File does not exist | File exists |\n|---|---|---|---|\n| `\"r\"` | read (default) | error | reads from the start |\n| `\"w\"` | write | creates it | **erases all content** |\n| `\"a\"` | append | creates it | adds at the end |\n| `\"x\"` | exclusive create | creates it | error |\n| `\"r+\"` | read and write | error | keeps the content |\n| `\"w+\"` | write and read | creates it | erases all, then you can read |\n| `\"a+\"` | append and read | creates it | writes at the end, you can read |\n\n### Writing and appending\n\n```python run\nwith open(\"diary.txt\", \"w\") as f:\n    f.write(\"Day 1: started Python.\\n\")\n    f.write(\"Day 2: learned loops.\\n\")\n\nwith open(\"diary.txt\", \"a\") as f:\n    f.write(\"Day 3: files!\\n\")\n\nwith open(\"diary.txt\") as f:\n    print(f.read())\n```\n\n> exam: `write()` does **not** add a new line by itself: write `\\n` where you need it. Mode `\"w\"` erases the old content, while `\"a\"` keeps it.\n\n### Reading\n\n```python run\nwith open(\"nums.txt\", \"w\") as f:\n    f.write(\"10\\n20\\n30\\n\")\n\nwith open(\"nums.txt\") as f:\n    first = f.readline()        # one line, including the \\n\n    print(repr(first))\n    rest = f.readlines()        # list of the remaining lines\n    print(rest)\n\ntotal = 0\nwith open(\"nums.txt\") as f:\n    for line in f:              # loop line by line\n        total += int(line.strip())\nprint(total)\n```\n\n- `read()` reads the whole file as one text.\n- `readline()` reads one line.\n- `readlines()` reads all lines into a list.\n- `for line in f:` goes through the lines one by one. `strip()` removes the `\\n` at the end.\n\n### The cursor and seek()\n\nPython remembers where you are in the file. After you write, the cursor is at the end; if you read immediately, you get nothing. `seek(0)` takes it to the start, and `tell()` shows the position.\n\n```python run\nwith open(\"note.txt\", \"w+\") as f:\n    f.write(\"Saved!\")\n    print(repr(f.read()))     # nothing: the cursor is at the end\n    f.seek(0)\n    print(f.read())\n    print(f.tell())\n```\n\n### The file closes by itself\n\n```python run\nwith open(\"a.txt\", \"w\") as f:\n    f.write(\"x\")\nprint(f.closed)\n```\n\nIf you do not use `with`, you must call `f.close()` yourself. A file that does not exist, opened with `\"r\"`, gives `FileNotFoundError` (see the lesson on exceptions).\n\n```python run err\nwith open(\"ghost.txt\", \"r\") as f:\n    print(f.read())\n```\n"}, "check": [{"type": "mcq", "q": {"ro": "Care mod șterge conținutul existent al fișierului?", "en": "Which mode erases the existing content of the file?"}, "options": ["\"r\"", "\"a\"", "\"w\"", "\"x\""], "mono": true, "answer": 2, "expl": {"ro": "`\"w\"` golește fișierul la deschidere. `\"a\"` adaugă la sfârșit, `\"x\"` dă eroare dacă fișierul există.", "en": "`\"w\"` empties the file on opening. `\"a\"` appends at the end, `\"x\"` gives an error if the file exists."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"A\")\nwith open(\"t.txt\", \"w\") as f:\n    f.write(\"B\")\nwith open(\"t.txt\") as f:\n    print(f.read())\n", "options": ["A", "B", "AB", "BA"], "answer": 1, "verify": "out", "expl": {"ro": "A doua deschidere cu `\"w\"` șterge `A` și scrie `B`.", "en": "The second opening with `\"w\"` erases `A` and writes `B`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"A\")\nwith open(\"t.txt\", \"a\") as f:\n    f.write(\"B\")\nwith open(\"t.txt\") as f:\n    print(f.read())\n", "options": ["A", "B", "AB", "BA"], "answer": 2, "verify": "out", "expl": {"ro": "Modul `\"a\"` păstrează `A` și adaugă `B` la sfârșit.", "en": "Mode `\"a\"` keeps `A` and adds `B` at the end."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "with open(\"t.txt\", \"w+\") as f:\n    f.write(\"Saved\")\n    print(repr(f.read()))\n    f.seek(0)\n    print(f.read())\n", "options": ["'Saved'\nSaved", "''\nSaved", "''\n''", "Saved\nSaved"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "După `write`, cursorul e la sfârșit, deci primul `read()` dă șirul gol. După `seek(0)` citești tot.", "en": "After `write`, the cursor is at the end, so the first `read()` gives the empty string. After `seek(0)` you read everything."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "with open(\"n.txt\", \"w\") as f:\n    f.write(\"a\\nb\\nc\\n\")\nwith open(\"n.txt\") as f:\n    lines = f.readlines()\nprint(len(lines), repr(lines[0]))\n", "options": ["3 'a'", "3 'a\\n'", "4 'a\\n'", "1 'a\\nb\\nc\\n'"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "`readlines()` păstrează `\\n`-ul fiecărei linii; sunt 3 linii.", "en": "`readlines()` keeps the `\\n` of each line; there are 3 lines."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul dacă `ghost.txt` nu există?", "en": "What error does the code produce if `ghost.txt` does not exist?"}, "code": "open(\"ghost.txt\", \"r\")\n", "options": ["FileNotFoundError", "KeyError", "ValueError", "PermissionError"], "answer": 0, "verify": "err", "expl": {"ro": "Citirea unui fișier inexistent dă `FileNotFoundError`.", "en": "Reading a file that does not exist gives `FileNotFoundError`."}}, {"type": "multi", "q": {"ro": "Care afirmații despre `with open(...) as f:` sunt adevărate?", "en": "Which statements about `with open(...) as f:` are true?"}, "options": [{"ro": "Închide fișierul automat la ieșirea din bloc.", "en": "It closes the file automatically when leaving the block."}, {"ro": "Închide fișierul și dacă apare o eroare în bloc.", "en": "It closes the file even if an error occurs in the block."}, {"ro": "Trebuie să apelezi `f.close()` după bloc.", "en": "You must call `f.close()` after the block."}, {"ro": "Poate fi folosit doar pentru citire.", "en": "It can be used only for reading."}], "answer": [0, 1], "expl": {"ro": "`with` gestionează închiderea; merge cu orice mod de deschidere.", "en": "`with` handles the closing; it works with any opening mode."}}], "exercises": [{"title": {"ro": "Jurnalul", "en": "The diary"}, "task": {"ro": "Scrie `write_diary(entries)`: primește o listă de texte și le scrie în `diary.txt`, **câte unul pe linie** (fiecare urmat de `\\n`). Folosește `with` și modul `\"w\"`.\n", "en": "Write `write_diary(entries)`: it receives a list of texts and writes them to `diary.txt`, **one per line** (each followed by `\\n`). Use `with` and mode `\"w\"`.\n"}, "starter": "def write_diary(entries):\n    pass\n", "hint": {"ro": "`for entry in entries: f.write(entry + \"\\n\")` în interiorul blocului `with`.", "en": "`for entry in entries: f.write(entry + \"\\n\")` inside the `with` block."}, "solution": "def write_diary(entries):\n    with open(\"diary.txt\", \"w\") as f:\n        for entry in entries:\n            f.write(entry + \"\\n\")\n", "tests": [{"append": "write_diary(['Day 1', 'Day 2', 'Day 3'])\nwith open('diary.txt') as f:\n    print(f.read().split('\\n'))", "expect": "['Day 1', 'Day 2', 'Day 3', '']"}, {"append": "write_diary(['x'])\nwrite_diary(['y', 'z'])\nwith open('diary.txt') as f:\n    print(f.read().split('\\n'))", "expect": "['y', 'z', '']", "hidden": true}]}, {"title": {"ro": "Numără liniile", "en": "Count the lines"}, "task": {"ro": "Scrie `count_lines(filename)`: returnează numărul de linii din fișier.\n", "en": "Write `count_lines(filename)`: return the number of lines in the file.\n"}, "starter": "def count_lines(filename):\n    pass\n", "hint": {"ro": "`len(f.readlines())` sau un contor în `for line in f:`.", "en": "`len(f.readlines())` or a counter in `for line in f:`."}, "solution": "def count_lines(filename):\n    with open(filename) as f:\n        return len(f.readlines())\n", "tests": [{"append": "with open('x.txt', 'w') as f:\n    f.write('a\\nb\\nc\\n')\nprint(count_lines('x.txt'))", "expect": "3"}, {"append": "with open('y.txt', 'w') as f:\n    f.write('only one')\nprint(count_lines('y.txt'))", "expect": "1", "hidden": true}]}, {"title": {"ro": "Adaugă la fișier", "en": "Append to a file"}, "task": {"ro": "Scrie `add_line(filename, text)`: adaugă `text` și un `\\n` la **sfârșitul** fișierului (fără să șteargă ce era) și returnează numărul total de linii din fișier după adăugare.\n", "en": "Write `add_line(filename, text)`: add `text` and a `\\n` at the **end** of the file (without erasing what was there) and return the total number of lines in the file after adding.\n"}, "starter": "def add_line(filename, text):\n    pass\n", "hint": {"ro": "Deschide cu `\"a\"` pentru adăugare, apoi redeschide cu `\"r\"` ca să numeri liniile.", "en": "Open with `\"a\"` to append, then reopen with `\"r\"` to count the lines."}, "solution": "def add_line(filename, text):\n    with open(filename, \"a\") as f:\n        f.write(text + \"\\n\")\n    with open(filename) as f:\n        return len(f.readlines())\n", "tests": [{"append": "print(add_line('log.txt', 'first'))\nprint(add_line('log.txt', 'second'))\nprint(add_line('log.txt', 'third'))", "expect": "1\n2\n3"}]}]}, {"id": "l13", "n": 14, "part": 3, "domain": 3, "title": {"ro": "Foldere, os, sys și io", "en": "Folders, os, sys and io"}, "goal": {"ro": "Să lucrezi cu foldere și căi folosind os și os.path, să citești argumentele din linia de comandă cu sys și să folosești io.StringIO.", "en": "Work with folders and paths using os and os.path, read command-line arguments with sys, and use io.StringIO."}, "theory": {"ro": "> new: Modulele `os.path` și `io` apar în obiectivele 3.1 și 6.1 ale examenului. Funcțiile `os.path.join`, `isfile`, `splitext` și `os.rename` sunt completări față de materialele inițiale.\n\n### Modulul os\n\n```python run\nimport os\n\nprint(os.getcwd() != \"\")                 # current working directory\nos.mkdir(\"school\")                       # one folder\nos.makedirs(\"school/python/homework\")    # nested folders\nopen(\"school/notes.txt\", \"w\").close()    # an empty file\nprint(sorted(os.listdir(\"school\")))\nos.rename(\"school/notes.txt\", \"school/old.txt\")\nprint(sorted(os.listdir(\"school\")))\nos.remove(\"school/old.txt\")              # delete a file\nprint(os.listdir(\"school\"))\n```\n\n| Funcție | Ce face |\n|---|---|\n| `os.getcwd()` | folderul curent |\n| `os.listdir(cale)` | lista numelor din folder |\n| `os.mkdir(cale)` | creează **un** folder (eroare dacă părintele lipsește sau folderul există) |\n| `os.makedirs(cale)` | creează toată calea, inclusiv părinții |\n| `os.remove(cale)` | șterge un fișier |\n| `os.rmdir(cale)` | șterge un folder gol |\n| `os.rename(vechi, nou)` | redenumește sau mută |\n\n```python run err\nimport os\nos.mkdir(\"x/y\")\n```\n\n### os.path: lucrul cu căile\n\n```python run\nimport os\n\nwith open(\"data.txt\", \"w\") as f:\n    f.write(\"hello\")\nos.mkdir(\"docs\")\n\nprint(os.path.exists(\"data.txt\"), os.path.exists(\"nope.txt\"))\nprint(os.path.isfile(\"data.txt\"), os.path.isdir(\"docs\"))\nprint(os.path.getsize(\"data.txt\"))\nprint(os.path.join(\"docs\", \"report.pdf\"))\nprint(os.path.basename(\"docs/report.pdf\"), os.path.dirname(\"docs/report.pdf\"))\nprint(os.path.splitext(\"report.final.pdf\"))\n```\n\n> exam: `os.path.exists()` este `True` și pentru fișiere, și pentru foldere. `isfile()` și `isdir()` fac diferența. Pentru căi folosește `os.path.join()`, nu `+` cu `/`.\n\n### Modulul sys: argumente și ieșire\n\n`sys.argv` este lista cuvintelor scrise după numele scriptului în linia de comandă. `sys.argv[0]` este numele scriptului. Pe pagina asta poți scrie argumentele în caseta „Argumente\".\n\n```python run args=Maria\nimport sys\n\nprint(sys.argv)\nif len(sys.argv) < 2:\n    print(\"Usage: python greet.py <name>\")\n    sys.exit(1)             # stop the program now\nprint(\"Hello,\", sys.argv[1])\n```\n\nȘterge `Maria` din caseta „Argumente\" și rulează iar: programul afișează mesajul de utilizare și se oprește. `sys.exit()` fără număr (sau cu 0) înseamnă „terminat cu succes\", iar o valoare diferită de zero înseamnă eroare.\n\n> tip: Toate argumentele din `sys.argv` sunt **texte**. Pentru numere folosește `int(sys.argv[1])`.\n\n### Modulul io: fișiere în memorie\n\n`io.StringIO` se comportă ca un fișier, dar ține textul în memorie. E util la teste și când vrei să folosești funcții pentru fișiere fără un fișier real.\n\n```python run\nimport io\n\nbuffer = io.StringIO()\nbuffer.write(\"line 1\\n\")\nbuffer.write(\"line 2\\n\")\nprint(buffer.getvalue().upper())\n\nreader = io.StringIO(\"a\\nb\\nc\")\nfor line in reader:\n    print(line.strip())\n```\n", "en": "> new: The `os.path` and `io` modules appear in exam objectives 3.1 and 6.1. The functions `os.path.join`, `isfile`, `splitext` and `os.rename` are additions to the original materials.\n\n### The os module\n\n```python run\nimport os\n\nprint(os.getcwd() != \"\")                 # current working directory\nos.mkdir(\"school\")                       # one folder\nos.makedirs(\"school/python/homework\")    # nested folders\nopen(\"school/notes.txt\", \"w\").close()    # an empty file\nprint(sorted(os.listdir(\"school\")))\nos.rename(\"school/notes.txt\", \"school/old.txt\")\nprint(sorted(os.listdir(\"school\")))\nos.remove(\"school/old.txt\")              # delete a file\nprint(os.listdir(\"school\"))\n```\n\n| Function | What it does |\n|---|---|\n| `os.getcwd()` | the current folder |\n| `os.listdir(path)` | list of the names in a folder |\n| `os.mkdir(path)` | creates **one** folder (error if the parent is missing or the folder exists) |\n| `os.makedirs(path)` | creates the whole path, parents included |\n| `os.remove(path)` | deletes a file |\n| `os.rmdir(path)` | deletes an empty folder |\n| `os.rename(old, new)` | renames or moves |\n\n```python run err\nimport os\nos.mkdir(\"x/y\")\n```\n\n### os.path: working with paths\n\n```python run\nimport os\n\nwith open(\"data.txt\", \"w\") as f:\n    f.write(\"hello\")\nos.mkdir(\"docs\")\n\nprint(os.path.exists(\"data.txt\"), os.path.exists(\"nope.txt\"))\nprint(os.path.isfile(\"data.txt\"), os.path.isdir(\"docs\"))\nprint(os.path.getsize(\"data.txt\"))\nprint(os.path.join(\"docs\", \"report.pdf\"))\nprint(os.path.basename(\"docs/report.pdf\"), os.path.dirname(\"docs/report.pdf\"))\nprint(os.path.splitext(\"report.final.pdf\"))\n```\n\n> exam: `os.path.exists()` is `True` for both files and folders. `isfile()` and `isdir()` tell them apart. For paths use `os.path.join()`, not `+` with `/`.\n\n### The sys module: arguments and exit\n\n`sys.argv` is the list of words typed after the script name on the command line. `sys.argv[0]` is the script name. On this page you can type the arguments in the \"Arguments\" box.\n\n```python run args=Maria\nimport sys\n\nprint(sys.argv)\nif len(sys.argv) < 2:\n    print(\"Usage: python greet.py <name>\")\n    sys.exit(1)             # stop the program now\nprint(\"Hello,\", sys.argv[1])\n```\n\nDelete `Maria` from the \"Arguments\" box and run again: the program prints the usage message and stops. `sys.exit()` with no number (or with 0) means \"finished successfully\", and a non-zero value means an error.\n\n> tip: All the arguments in `sys.argv` are **text**. For numbers use `int(sys.argv[1])`.\n\n### The io module: files in memory\n\n`io.StringIO` behaves like a file, but keeps the text in memory. It is useful for tests and when you want to use file functions without a real file.\n\n```python run\nimport io\n\nbuffer = io.StringIO()\nbuffer.write(\"line 1\\n\")\nbuffer.write(\"line 2\\n\")\nprint(buffer.getvalue().upper())\n\nreader = io.StringIO(\"a\\nb\\nc\")\nfor line in reader:\n    print(line.strip())\n```\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "import os\nprint(os.path.join(\"a\", \"b.txt\"))\n", "options": ["a/b.txt", "ab.txt", "a b.txt", "a+b.txt"], "mono": true, "answer": 0, "verify": "out", "expl": {"ro": "`os.path.join` leagă părțile cu separatorul de căi al sistemului.", "en": "`os.path.join` joins the parts with the system's path separator."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "import os\nprint(os.path.splitext(\"report.final.pdf\"))\n", "options": ["('report', '.final.pdf')", "('report.final', '.pdf')", "['report.final', 'pdf']", "('report.final.pdf', '')"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "`splitext` desparte la ultimul punct și păstrează punctul în extensie.", "en": "`splitext` splits at the last dot and keeps the dot in the extension."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul dacă folderul `x` nu există?", "en": "What error does the code produce if the folder `x` does not exist?"}, "code": "import os\nos.mkdir(\"x/y\")\n", "options": ["FileNotFoundError", "FileExistsError", "ValueError", "PermissionError"], "answer": 0, "verify": "err", "expl": {"ro": "`mkdir` nu creează părinți. Pentru `x/y` ai nevoie de `os.makedirs(\  \"\\n\"`, then count the lines."}, "solution": "import os\n\ndef log_message(message, folder=\"logs\", filename=\"activity.log\"):\n    if not os.path.exists(folder):\n        os.mkdir(folder)\n    path = os.path.join(folder, filename)\n    with open(path, \"a\") as f:\n        f.write(message + \"\\n\")\n    with open(path) as f:\n        return len(f.readlines())\n", "tests": [{"append": "print(log_message('start'))\nprint(log_message('working'))\nprint(log_message('end'))\nprint(os.listdir('logs'))", "expect": "1\n2\n3\n['activity.log']"}, {"append": "print(log_message('x', 'other', 'a.txt'))\nprint(os.listdir('other'))", "expect": "1\n['a.txt']", "hidden": true}]}, {"title": {"ro": "Salutul din linia de comandă", "en": "Command-line greeter"}, "task": {"ro": "Scrie un program care folosește `sys.argv`: dacă nu primește niciun argument, afișează `Usage: python greet.py <name>` și se oprește cu `sys.exit(1)`; altfel afișează `Hello, ` urmat de primul argument. Scrie argumentul în caseta „Argumente” ca să-l încerci.\n", "en": "Write a program that uses `sys.argv`: if it receives no argument, print `Usage: python greet.py <name>` and stop with `sys.exit(1)`; otherwise print `Hello, ` followed by the first argument. Type the argument in the \"Arguments\" box to try it.\n"}, "starter": "import sys\n\n# check len(sys.argv), then greet or print the usage message\n", "hint": {"ro": "`if len(sys.argv) < 2:` afișează mesajul și `sys.exit(1)`. Altfel `print(\"Hello,\", sys.argv[1])`.", "en": "`if len(sys.argv) < 2:` print the message and `sys.exit(1)`. Otherwise `print(\"Hello,\", sys.argv[1])`."}, "solution": "import sys\n\nif len(sys.argv) < 2:\n    print(\"Usage: python greet.py <name>\")\n    sys.exit(1)\nprint(\"Hello,\", sys.argv[1])\n", "tests": [{"argv": ["Maria"], "expect": "Hello, Maria"}, {"argv": [], "expect": "Usage: python greet.py <name>"}, {"argv": ["Ion", "Pop"], "expect": "Hello, Ion", "hidden": true}]}]}, {"id": "l14", "n": 15, "part": 3, "domain": 5, "title": {"ro": "Erori și excepții", "en": "Errors and exceptions"}, "goal": {"ro": "Să deosebești tipurile de erori, să prinzi excepții cu try/except/else/finally, să ridici excepții proprii și să găsești și să repari greșeli în cod.", "en": "Tell the types of errors apart, catch exceptions with try/except/else/finally, raise your own exceptions, and find and fix mistakes in code."}, "theory": {"ro": "### Trei feluri de erori\n\n| Tip | Când apare | Exemplu |\n|---|---|---|\n| **Eroare de sintaxă** | înainte de rulare; programul nu pornește | lipsește `:` sau o paranteză |\n| **Eroare de execuție** (excepție) | programul pornește și se oprește la o linie | `10 / 0`, `int(\"abc\")` |\n| **Eroare de logică** | programul rulează, dar dă un rezultat greșit | `a + b / 2` în loc de `(a + b) / 2` |\n\nErorile de logică sunt cele mai greu de găsit: Python nu se plânge de nimic.\n\n```python run err\nprint(\"start\")\nif True\n    print(\"never runs\")\n```\n\n```python run\ndef average(a, b):\n    return a + b / 2      # logic error: it should be (a + b) / 2\n\nprint(average(4, 6))      # 7.0, but the correct answer is 5.0\n```\n\n### Excepții frecvente\n\n| Excepție | Cauză | Exemplu |\n|---|---|---|\n| `ValueError` | valoare de tip bun, dar nepotrivită | `int(\"hello\")` |\n| `TypeError` | tip nepotrivit | `\"a\" + 5` |\n| `ZeroDivisionError` | împărțire la zero | `10 / 0` |\n| `IndexError` | index în afara listei | `[1, 2][5]` |\n| `KeyError` | cheie lipsă din dicționar | `{\"a\": 1}[\"z\"]` |\n| `NameError` | nume nedefinit | `print(nope)` |\n| `FileNotFoundError` | fișier inexistent | `open(\"ghost.txt\")` |\n| `AttributeError` | atribut sau metodă inexistentă | `\"abc\".push()` |\n\n### Cum citești un mesaj de eroare\n\nCitește ultima linie: ea spune **tipul** erorii și motivul. Liniile de deasupra arată în ce linie de cod a apărut.\n\n```python run err\ndef divide(a, b):\n    return a / b\n\nprint(divide(10, 0))\n```\n\n### try și except\n\nPui codul riscant în `try`. Dacă apare o excepție, Python sare la `except`, în loc să oprească programul. Pune excepțiile **specifice** înaintea celei generale `Exception`.\n\n```python run in=abc\ntry:\n    number = int(input(\"Enter a number: \"))\n    print(100 / number)\nexcept ValueError:\n    print(\"That is not a valid number\")\nexcept ZeroDivisionError:\n    print(\"You cannot divide by zero\")\nexcept Exception as e:\n    print(\"Something else went wrong:\", e)\n```\n\nSchimbă valoarea din caseta de intrare în `0`, apoi în `4`, și urmărește ce ramură se execută.\n\n### else și finally\n\n- `else` se execută **doar dacă nu a apărut nicio excepție** în `try`.\n- `finally` se execută **întotdeauna**, cu sau fără excepție (potrivit pentru curățenie).\n\n```python run\ndef test(x):\n    try:\n        r = 10 / x\n    except ZeroDivisionError:\n        print(\"zero\")\n    else:\n        print(\"ok\", r)\n    finally:\n        print(\"done\")\n\ntest(2)\ntest(0)\n```\n\n### Mai multe tipuri de excepții și citirea mesajului\n\n```python run\nfor value in [\"5\", \"x\", None]:\n    try:\n        print(int(value) * 2)\n    except (ValueError, TypeError) as e:\n        print(\"Error:\", type(e).__name__)\n```\n\n### raise: ridici tu excepția\n\n```python run\ndef check_age(age):\n    if age < 0:\n        raise ValueError(\"Age cannot be negative\")\n    return age\n\ntry:\n    check_age(-5)\nexcept ValueError as e:\n    print(\"Caught:\", e)\n```\n\nPoți crea și excepții proprii, ca clase care moștenesc din `Exception`:\n\n```python run\nclass LowBalanceError(Exception):\n    pass\n\ntry:\n    raise LowBalanceError(\"Not enough money\")\nexcept LowBalanceError as e:\n    print(e)\n```\n\n### Depanare: pașii\n\n1. Rulează și citește **ultima linie** a erorii.\n2. Mergi la linia indicată (și la cea de dinainte).\n3. Dacă nu e eroare dar rezultatul e greșit, afișează valorile intermediare cu `print()`.\n4. Verifică limitele: primul și ultimul element, `range(1, n)` față de `range(1, n + 1)`.\n\n> exam: La întrebările „găsește eroarea\" caută: `:` lipsă, indentare, `=` în loc de `==`, ghilimele neînchise, un nume scris greșit, `str` + `int` și un `range` cu o unitate prea puțin.\n", "en": "### Three kinds of errors\n\n| Type | When it appears | Example |\n|---|---|---|\n| **Syntax error** | before running; the program does not start | a missing `:` or parenthesis |\n| **Runtime error** (exception) | the program starts and stops at a line | `10 / 0`, `int(\"abc\")` |\n| **Logic error** | the program runs, but gives a wrong result | `a + b / 2` instead of `(a + b) / 2` |\n\nLogic errors are the hardest to find: Python does not complain about anything.\n\n```python run err\nprint(\"start\")\nif True\n    print(\"never runs\")\n```\n\n```python run\ndef average(a, b):\n    return a + b / 2      # logic error: it should be (a + b) / 2\n\nprint(average(4, 6))      # 7.0, but the correct answer is 5.0\n```\n\n### Common exceptions\n\n| Exception | Cause | Example |\n|---|---|---|\n| `ValueError` | right type, unsuitable value | `int(\"hello\")` |\n| `TypeError` | wrong type | `\"a\" + 5` |\n| `ZeroDivisionError` | division by zero | `10 / 0` |\n| `IndexError` | index outside the list | `[1, 2][5]` |\n| `KeyError` | missing dictionary key | `{\"a\": 1}[\"z\"]` |\n| `NameError` | undefined name | `print(nope)` |\n| `FileNotFoundError` | file does not exist | `open(\"ghost.txt\")` |\n| `AttributeError` | missing attribute or method | `\"abc\".push()` |\n\n### How to read an error message\n\nRead the last line: it tells you the **type** of the error and the reason. The lines above show in which line of code it happened.\n\n```python run err\ndef divide(a, b):\n    return a / b\n\nprint(divide(10, 0))\n```\n\n### try and except\n\nPut risky code in `try`. If an exception occurs, Python jumps to `except` instead of stopping the program. Put **specific** exceptions before the general `Exception`.\n\n```python run in=abc\ntry:\n    number = int(input(\"Enter a number: \"))\n    print(100 / number)\nexcept ValueError:\n    print(\"That is not a valid number\")\nexcept ZeroDivisionError:\n    print(\"You cannot divide by zero\")\nexcept Exception as e:\n    print(\"Something else went wrong:\", e)\n```\n\nChange the value in the input box to `0`, then to `4`, and watch which branch runs.\n\n### else and finally\n\n- `else` runs **only if no exception occurred** in `try`.\n- `finally` runs **always**, with or without an exception (good for cleanup).\n\n```python run\ndef test(x):\n    try:\n        r = 10 / x\n    except ZeroDivisionError:\n        print(\"zero\")\n    else:\n        print(\"ok\", r)\n    finally:\n        print(\"done\")\n\ntest(2)\ntest(0)\n```\n\n### Several exception types, and reading the message\n\n```python run\nfor value in [\"5\", \"x\", None]:\n    try:\n        print(int(value) * 2)\n    except (ValueError, TypeError) as e:\n        print(\"Error:\", type(e).__name__)\n```\n\n### raise: you raise the exception\n\n```python run\ndef check_age(age):\n    if age < 0:\n        raise ValueError(\"Age cannot be negative\")\n    return age\n\ntry:\n    check_age(-5)\nexcept ValueError as e:\n    print(\"Caught:\", e)\n```\n\nYou can also create your own exceptions, as classes that inherit from `Exception`:\n\n```python run\nclass LowBalanceError(Exception):\n    pass\n\ntry:\n    raise LowBalanceError(\"Not enough money\")\nexcept LowBalanceError as e:\n    print(e)\n```\n\n### Debugging: the steps\n\n1. Run and read the **last line** of the error.\n2. Go to the line it points to (and the one before it).\n3. If there is no error but the result is wrong, print the intermediate values with `print()`.\n4. Check the limits: the first and last item, `range(1, n)` versus `range(1, n + 1)`.\n\n> exam: For \"find the error\" questions look for: a missing `:`, indentation, `=` instead of `==`, unclosed quotes, a misspelled name, `str` + `int`, and a `range` that is one unit short.\n"}, "check": [{"type": "mcq", "q": {"ro":
