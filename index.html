<style>:root{--paper:#F4F7FB;--card:#FFFFFF;--ink:#12203A;--muted:#566884;--line:#D8E0EC;--blue:#2B66A8;--blue-soft:#E4EEF9;--yellow:#FFD43B;--ok:#157A52;--ok-soft:#E2F4EB;--bad:#B83232;--bad-soft:#FBE7E7;--code:#0F1B33;--code-fg:#E7EEF9;--out:#0A1326;--sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.rules{max-width:62ch;padding-left:1.2em}.dpick{display:flex;gap:10px;flex-wrap:wrap}.attempts{padding-left:1.2em}.attempts .ok{color:var(--ok)}
.exam-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 14px;margin:0 0 18px;background:var(--ink);color:var(--paper);border-radius:12px}
.exam-bar .btn{color:var(--paper);border-color:rgba(255,255,255,.35)}.exam-bar .btn.on{background:var(--yellow);color:#12203A;border-color:var(--yellow)}
.timer{font:700 1.3rem var(--mono);min-width:5ch;text-align:right}.timer.low{color:#FF9A90}
.exam-cols{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;align-items:start}.exam-q .q{padding:18px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.exam-btns{display:flex;margin-top:14px}.exam-nav{position:sticky;top:76px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}.nlegend{font-weight:700;margin-bottom:8px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}.nb{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:5px 0;font:600 .85rem var(--mono);cursor:pointer;position:relative}.nb.ans{background:var(--blue-soft);border-color:var(--blue)}.nb.flag::after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:.7rem;color:var(--bad)}.nb.cur{background:var(--yellow);color:#12203A;border-color:var(--yellow)}
.score{display:flex;gap:22px;align-items:center;padding:20px;border-radius:14px;margin:16px 0}.score.pass{background:var(--ok-soft)}.score.fail{background:var(--bad-soft)}.big-n{font:700 3.6rem/1 var(--mono)}.score p{margin:.3em 0 0}
.rv{margin:10px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px 12px}.rv summary{cursor:pointer;padding:10px 0;font-weight:700}.rv.ok summary{color:var(--ok)}.rv.no summary{color:var(--bad)}
.pypill{position:fixed;left:16px;bottom:16px;z-index:30;padding:8px 14px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:.88rem;box-shadow:0 4px 16px rgba(0,0,0,.25)}.pypill.bad{background:var(--bad);color:#fff}
.scrim{display:none}.skip{position:absolute;left:-999px}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr)}main,.content{min-width:0;max-width:100vw}.topbar{flex-wrap:wrap;gap:8px}.prose table{display:block;overflow-x:auto}.side{position:fixed;z-index:20;left:0;top:0;width:min(86vw,330px);transform:translateX(-102%);transition:transform .2s}body.nav-open .side{transform:none}body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}.menu{display:inline-block}.hero{grid-template-columns:minmax(0,1fr)}.hero>*{min-width:0}.exam-cols{grid-template-columns:1fr}.exam-nav{position:static}.exam-bar{flex-wrap:wrap}}

<script>var COURSE = { lessons: [], bank: [] };
COURSE.parts = [
  { id: 1, title: { ro: 'Bazele limbajului', en: 'Language basics' } },
  { id: 2, title: { ro: 'Decizii, bucle și funcții', en: 'Decisions, loops and functions' } },
  { id: 3, title: { ro: 'Fișiere, erori și testare', en: 'Files, errors and testing' } },
  { id: 4, title: { ro: 'Module standard', en: 'Standard modules' } },
  { id: 5, title: { ro: 'Bonus', en: 'Bonus' } },
  { id: 7, title: { ro: 'Workbook: probleme tip examen', en: 'Workbook: exam-style tasks' } },
  { id: 6, title: { ro: 'Pregătirea finală', en: 'Final preparation' } }
];
COURSE.domains = [
  { id: 1, w: 9, title: { ro: 'Tipuri de date și operatori', en: 'Data types and operators' } },
  { id: 2, w: 10, title: { ro: 'Decizii și bucle', en: 'Decisions and loops' } },
  { id: 3, w: 8, title: { ro: 'Intrare și ieșire', en: 'Input and output' } },
  { id: 4, w: 4, title: { ro: 'Documentarea și structura codului', en: 'Code documentation and structure' } },
  { id: 5, w: 4, title: { ro: 'Depanare și gestionarea erorilor', en: 'Troubleshooting and error handling' } },
  { id: 6, w: 3, title: { ro: 'Module și instrumente', en: 'Modules and tools' } }
];

COURSE.lessons = [{"id": "l01", "n": 1, "part": 1, "domain": 1, "title": {"ro": "Primii pași: print, variabile, comentarii", "en": "First steps: print, variables, comments"}, "goal": {"ro": "Să scrii și să rulezi primul program, să creezi variabile cu nume corecte și să explici de ce contează indentarea.", "en": "Write and run your first program, create variables with valid names, and explain why indentation matters."}, "theory": {"ro": "Python este un limbaj de programare creat de Guido van Rossum (prima versiune: 1991). Se citește aproape ca engleza, de aceea e folosit la școală, în știința datelor, în inteligența artificială și în dezvoltarea web. Examenul Certiport verifică dacă poți **citi, scrie și depana** cod Python, așa că vei rula mult cod în acest curs.\n\n> tip: Aici nu trebuie să instalezi nimic: fiecare bloc de cod se poate modifica și rula cu butonul Rulează (sau Ctrl+Enter). Acasă poți instala Python de pe python.org (bifează „Add Python to PATH\") și poți lucra în IDLE sau VS Code.\n\n### Primul program\n\n```python run\n# This line is a comment - Python ignores it\nprint(\"Hello, World!\")\n```\n\nFuncția `print()` afișează pe ecran ce pui între paranteze. Textul se scrie între ghilimele `\"...\"` sau apostrofuri `'...'`. Schimbă mesajul și rulează din nou.\n\n### Comentarii\n\nTot ce urmează după `#` pe o linie este ignorat de Python. Comentariile explică de ce face codul ceva, pentru oamenii care îl citesc.\n\n### Indentarea contează\n\nPython nu folosește acolade `{ }`. Blocurile de cod se arată prin **indentare**: de obicei 4 spații. Dacă o linie dintr-un bloc nu e indentată, primești o eroare.\n\n```python run err\nage = 15\nif age >= 14:\nprint(\"You can have an ID\")\n```\n\nRulează blocul de mai sus și citește eroarea: `IndentationError: expected an indented block`. Pune 4 spații înaintea lui `print` și va funcționa.\n\n> exam: Fiecare linie care se termină cu două puncte `:` (if, for, while, def, class) cere un bloc indentat dedesubt. Nu pui `;` la sfârșitul liniilor.\n\n### Variabile\n\nO variabilă este un nume care „ține minte\" o valoare. O creezi cu semnul `=` (atribuire). Poți schimba oricând valoarea.\n\n```python run\nname = \"Alex\"\nage = 15\nprint(name, age)\nage = age + 1\nprint(name, age)\n```\n\nO linie ca `age = age + 1` se citește de la dreapta la stânga: întâi se calculează `age + 1`, apoi rezultatul se pune înapoi în `age`.\n\n### Reguli pentru numele variabilelor\n\n| Nume | Valid? | Motiv |\n|---|---|---|\n| `my_score` | da | litere, cifre și `_` |\n| `score2` | da | cifra nu e prima |\n| `2nd_place` | nu | începe cu o cifră |\n| `my-score` | nu | `-` este operatorul minus |\n| `class` | nu | e cuvânt rezervat în Python |\n| `Age` și `age` | da, dar diferite | Python deosebește literele mari de cele mici |\n\n### print cu mai multe valori\n\n```python run\nfirst = \"Jordan\"\nprint(\"Hello,\", first)   # the comma adds a space\nprint(\"Hello, \" + first) # + joins text, you add the space yourself\n```\n\n> tip: Folosește virgula în `print()` când amesteci text cu numere. Cu `+` poți uni doar text cu text.\n", "en": "Python is a programming language created by Guido van Rossum (first released in 1991). It reads almost like English, which is why it is used in schools, data science, artificial intelligence and web development. The Certiport exam checks whether you can **read, write and debug** Python code, so you will run a lot of code in this course.\n\n> tip: You do not need to install anything here: every code block can be edited and run with the Run button (or Ctrl+Enter). At home you can install Python from python.org (tick \"Add Python to PATH\") and work in IDLE or VS Code.\n\n### The first program\n\n```python run\n# This line is a comment - Python ignores it\nprint(\"Hello, World!\")\n```\n\nThe `print()` function shows on screen whatever you put in the parentheses. Text goes between quotes `\"...\"` or apostrophes `'...'`. Change the message and run it again.\n\n### Comments\n\nEverything after `#` on a line is ignored by Python. Comments explain why the code does something, for the people who read it.\n\n### Indentation matters\n\nPython does not use braces `{ }`. Code blocks are shown by **indentation**: usually 4 spaces. If a line inside a block is not indented, you get an error.\n\n```python run err\nage = 15\nif age >= 14:\nprint(\"You can have an ID\")\n```\n\nRun the block above and read the error: `IndentationError: expected an indented block`. Put 4 spaces before `print` and it will work.\n\n> exam: Every line that ends with a colon `:` (if, for, while, def, class) needs an indented block below it. You do not put `;` at the end of lines.\n\n### Variables\n\nA variable is a name that \"remembers\" a value. You create it with the `=` sign (assignment). You can change the value at any time.\n\n```python run\nname = \"Alex\"\nage = 15\nprint(name, age)\nage = age + 1\nprint(name, age)\n```\n\nA line like `age = age + 1` is read right to left: first `age + 1` is calculated, then the result is stored back in `age`.\n\n### Rules for variable names\n\n| Name | Valid? | Reason |\n|---|---|---|\n| `my_score` | yes | letters, digits and `_` |\n| `score2` | yes | the digit is not first |\n| `2nd_place` | no | starts with a digit |\n| `my-score` | no | `-` is the minus operator |\n| `class` | no | it is a reserved word in Python |\n| `Age` and `age` | yes, but different | Python is case-sensitive |\n\n### print with several values\n\n```python run\nfirst = \"Jordan\"\nprint(\"Hello,\", first)   # the comma adds a space\nprint(\"Hello, \" + first) # + joins text, you add the space yourself\n```\n\n> tip: Use the comma in `print()` when you mix text and numbers. With `+` you can only join text to text.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "x = 5\nx = x + 2\nprint(x)\n", "options": ["5", "7", "x + 2", "Error"], "answer": 1, "verify": "out", "expl": {"ro": "Întâi se calculează `x + 2` cu x = 5, adică 7, și rezultatul se pune înapoi în `x`.", "en": "First `x + 2` is calculated with x = 5, giving 7, and the result is stored back in `x`."}}, {"type": "mcq", "q": {"ro": "Care este un nume de variabilă valid?", "en": "Which is a valid variable name?"}, "options": ["2nd_place", "my-score", "my_score", "class"], "mono": true, "answer": 2, "expl": {"ro": "Numele nu poate începe cu cifră, nu poate conține `-` și nu poate fi un cuvânt rezervat ca `class`.", "en": "A name cannot start with a digit, cannot contain `-`, and cannot be a reserved word such as `class`."}}, {"type": "mcq", "q": {"ro": "Care linie este un comentariu în Python?", "en": "Which line is a comment in Python?"}, "options": ["// note", "# note", "/* note */", "-- note"], "mono": true, "answer": 1, "expl": {"ro": "Comentariile încep cu `#`. Celelalte forme sunt din alte limbaje.", "en": "Comments start with `#`. The other forms come from other languages."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "a = 3\nb = a\na = 10\nprint(b)\n", "options": ["3", "10", "13", "a"], "answer": 0, "verify": "out", "expl": {"ro": "`b = a` copiază valoarea 3. Când `a` se schimbă ulterior, `b` rămâne 3.", "en": "`b = a` copies the value 3. When `a` changes later, `b` stays 3."}}, {"type": "yesno", "q": {"ro": "Alege Da sau Nu pentru fiecare afirmație.", "en": "Choose Yes or No for each statement."}, "items": [{"t": {"ro": "Indentarea face parte din sintaxa Python.", "en": "Indentation is part of Python syntax."}, "ans": true}, {"t": {"ro": "Fiecare linie trebuie să se termine cu `;`.", "en": "Every line must end with `;`."}, "ans": false}, {"t": {"ro": "`Age` și `age` sunt două variabile diferite.", "en": "`Age` and `age` are two different variables."}, "ans": true}, {"t": {"ro": "O variabilă poate primi o valoare nouă după ce a fost creată.", "en": "A variable can get a new value after it has been created."}, "ans": true}], "expl": {"ro": "Python folosește indentarea pentru blocuri, nu cere `;`, deosebește literele mari de cele mici și lasă variabilele să fie reatribuite.", "en": "Python uses indentation for blocks, does not need `;`, is case-sensitive, and lets variables be reassigned."}}], "exercises": [{"title": {"ro": "Cartea de vizită", "en": "Business card"}, "task": {"ro": "Variabilele `name`, `age` și `subject` sunt deja create. Afișează-le pe trei linii, exact așa: `Name: Ana`, `Age: 15`, `Subject: Python`. Folosește variabilele, nu textul scris de mână.\n", "en": "The variables `name`, `age` and `subject` already exist. Print them on three lines, exactly like this: `Name: Ana`, `Age: 15`, `Subject: Python`. Use the variables, not hand-typed text.\n"}, "starter": "name = \"Ana\"\nage = 15\nsubject = \"Python\"\n# print the three lines below\n", "hint": {"ro": "`print(\"Name:\", name)` pune automat un spațiu între cele două valori.", "en": "`print(\"Name:\", name)` automatically puts a space between the two values."}, "solution": "name = \"Ana\"\nage = 15\nsubject = \"Python\"\nprint(\"Name:\", name)\nprint(\"Age:\", age)\nprint(\"Subject:\", subject)\n", "tests": [{"expect": "Name: Ana\nAge: 15\nSubject: Python"}]}, {"title": {"ro": "Schimbă valorile", "en": "Swap the values"}, "task": {"ro": "Variabilele `a` și `b` au valorile 3 și 8. Schimbă-le între ele folosind o a treia variabilă, apoi afișează `a` și `b`, fiecare pe linia lui. Rezultatul trebuie să fie 8 și apoi 3.\n", "en": "The variables `a` and `b` hold 3 and 8. Swap them using a third variable, then print `a` and `b`, each on its own line. The result must be 8 and then 3.\n"}, "starter": "a = 3\nb = 8\n# swap a and b using a temporary variable, then print them\n", "hint": {"ro": "Pune întâi valoarea lui `a` într-o variabilă temporară `temp`, apoi `a = b`, apoi `b = temp`.", "en": "First store the value of `a` in a temporary variable `temp`, then `a = b`, then `b = temp`."}, "solution": "a = 3\nb = 8\ntemp = a\na = b\nb = temp\nprint(a)\nprint(b)\n", "tests": [{"expect": "8\n3"}]}, {"title": {"ro": "Repară indentarea", "en": "Fix the indentation"}, "task": {"ro": "Codul de mai jos dă eroare. Repară-l ca să afișeze `Passed`, apoi `Welcome!`. Linia cu `Welcome!` trebuie să se execute întotdeauna, nu doar în `if`.\n", "en": "The code below gives an error. Fix it so it prints `Passed`, then `Welcome!`. The `Welcome!` line must always run, not only inside the `if`.\n"}, "starter": "score = 80\nif score >= 50:\nprint(\"Passed\")\nprint(\"Welcome!\")\n", "hint": {"ro": "Doar linia din interiorul lui `if` primește 4 spații în față.", "en": "Only the line inside the `if` gets 4 spaces in front."}, "solution": "score = 80\nif score >= 50:\n    print(\"Passed\")\nprint(\"Welcome!\")\n", "tests": [{"expect": "Passed\nWelcome!"}]}]}, {"id": "l02", "n": 2, "part": 1, "domain": 1, "title": {"ro": "Tipuri de date și conversii", "en": "Data types and conversions"}, "goal": {"ro": "Să identifici tipul unei valori sau expresii, să faci conversii corecte între tipuri și să calculezi cu operatorii aritmetici.", "en": "Identify the type of a value or expression, convert correctly between types, and calculate with the arithmetic operators."}, "theory": {"ro": "Fiecare valoare din Python are un **tip**. Cele patru tipuri de bază sunt:\n\n| Tip | Exemplu | Ce păstrează |\n|---|---|---|\n| `str` | `\"Hello\"` | text |\n| `int` | `42` | numere întregi |\n| `float` | `3.14` | numere cu zecimale |\n| `bool` | `True` / `False` | adevărat sau fals |\n\n```python run\nscore = 95\ngpa = 3.8\nname = \"Sam\"\npassed = True\nprint(type(score))\nprint(type(gpa))\nprint(type(name))\nprint(type(passed))\n```\n\n### Operatori aritmetici\n\n```python run\na = 10\nb = 3\nprint(a + b)    # addition\nprint(a - b)    # subtraction\nprint(a * b)    # multiplication\nprint(a / b)    # division: always a float\nprint(a // b)   # floor division: whole part\nprint(a % b)    # modulus: remainder\nprint(a ** b)   # power\n```\n\n> exam: `/` returnează **întotdeauna** `float` (`10 / 2` este `5.0`). `//` dă câtul întreg, iar la numere negative rotunjește în jos: `-7 // 2` este `-4`. `%` dă restul.\n\n### Conversii între tipuri\n\nFuncțiile `int()`, `float()`, `str()` și `bool()` convertesc o valoare în alt tip.\n\n```python run\nprint(int(\"42\") + 1)     # text to int\nprint(int(3.9))          # cuts the decimals, does not round\nprint(float(\"2.5\") * 2)\nprint(str(15) + \" years\")\nprint(round(2.5), round(3.5))   # rounds to the nearest even on .5\n```\n\n### Ce este „adevărat\"?\n\n`bool()` dă `False` pentru valori „goale\": `0`, `0.0`, `\"\"` (text gol), `[]`, `{}` și `None`. Orice altceva este `True`, chiar și textul `\"False\"`.\n\n```python run\nprint(bool(0), bool(\"\"), bool([]))\nprint(bool(\"False\"), bool(-1), bool(\" \"))\nprint(True + 1, False + 5)    # bool behaves like 0 and 1\n```\n\n### Text cu numere\n\nNu poți aduna text cu număr. Fie convertești numărul cu `str()`, fie folosești virgula în `print()`. Operatorul `*` repetă textul.\n\n```python run err\nage = 15\nprint(\"I am \" + age + \" years old\")\n```\n\n```python run\nage = 15\nprint(\"I am \" + str(age) + \" years old\")\nprint(\"I am\", age, \"years old\")\nprint(\"ab\" * 3)\n```\n\n> warn: `\"5\" + \"5\"` dă `\"55\"` (text lipit), iar `5 + 5` dă `10`. `\"5\" * 3` dă `\"555\"`.\n", "en": "Every value in Python has a **type**. The four basic types are:\n\n| Type | Example | What it stores |\n|---|---|---|\n| `str` | `\"Hello\"` | text |\n| `int` | `42` | whole numbers |\n| `float` | `3.14` | numbers with decimals |\n| `bool` | `True` / `False` | true or false |\n\n```python run\nscore = 95\ngpa = 3.8\nname = \"Sam\"\npassed = True\nprint(type(score))\nprint(type(gpa))\nprint(type(name))\nprint(type(passed))\n```\n\n### Arithmetic operators\n\n```python run\na = 10\nb = 3\nprint(a + b)    # addition\nprint(a - b)    # subtraction\nprint(a * b)    # multiplication\nprint(a / b)    # division: always a float\nprint(a // b)   # floor division: whole part\nprint(a % b)    # modulus: remainder\nprint(a ** b)   # power\n```\n\n> exam: `/` **always** returns a `float` (`10 / 2` is `5.0`). `//` gives the whole quotient and rounds down for negatives: `-7 // 2` is `-4`. `%` gives the remainder.\n\n### Converting between types\n\nThe functions `int()`, `float()`, `str()` and `bool()` convert a value to another type.\n\n```python run\nprint(int(\"42\") + 1)     # text to int\nprint(int(3.9))          # cuts the decimals, does not round\nprint(float(\"2.5\") * 2)\nprint(str(15) + \" years\")\nprint(round(2.5), round(3.5))   # rounds to the nearest even on .5\n```\n\n### What counts as \"true\"?\n\n`bool()` gives `False` for \"empty\" values: `0`, `0.0`, `\"\"` (empty text), `[]`, `{}` and `None`. Anything else is `True`, even the text `\"False\"`.\n\n```python run\nprint(bool(0), bool(\"\"), bool([]))\nprint(bool(\"False\"), bool(-1), bool(\" \"))\nprint(True + 1, False + 5)    # bool behaves like 0 and 1\n```\n\n### Text with numbers\n\nYou cannot add text and a number. Either convert the number with `str()` or use the comma in `print()`. The `*` operator repeats text.\n\n```python run err\nage = 15\nprint(\"I am \" + age + \" years old\")\n```\n\n```python run\nage = 15\nprint(\"I am \" + str(age) + \" years old\")\nprint(\"I am\", age, \"years old\")\nprint(\"ab\" * 3)\n```\n\n> warn: `\"5\" + \"5\"` gives `\"55\"` (joined text), while `5 + 5` gives `10`. `\"5\" * 3` gives `\"555\"`.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce tip are rezultatul expresiei?", "en": "What type is the result of the expression?"}, "code": "print(type(7 / 2))\n", "options": ["<class 'int'>", "<class 'float'>", "<class 'str'>", "<class 'bool'>"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "Operatorul `/` returnează întotdeauna `float`, chiar dacă împărțirea e exactă.", "en": "The `/` operator always returns a `float`, even when the division is exact."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(7 // 2, 7 % 2)\n", "options": ["3.5 1", "3 1", "4 1", "3 0"], "answer": 1, "verify": "out", "expl": {"ro": "`7 // 2` este câtul întreg 3, iar `7 % 2` este restul 1.", "en": "`7 // 2` is the whole quotient 3, and `7 % 2` is the remainder 1."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"5\" * 3)\n", "options": ["15", "555", "5 5 5", "Error"], "answer": 1, "verify": "out", "expl": {"ro": "Un text înmulțit cu un întreg se repetă: `\"5\" * 3` este `\"555\"`.", "en": "Text multiplied by an integer is repeated: `\"5\" * 3` is `\"555\"`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(bool(\"False\"), bool(0), bool([]))\n", "options": ["False False False", "True False False", "True True False", "True False True"], "answer": 1, "verify": "out", "expl": {"ro": "Orice text nevid este `True`, chiar și `\"False\"`. `0` și lista goală sunt `False`.", "en": "Any non-empty text is `True`, even `\"False\"`. `0` and the empty list are `False`."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul?", "en": "What error does the code produce?"}, "code": "print(\"Age: \" + 15)\n", "options": ["TypeError", "ValueError", "SyntaxError", "NameError"], "answer": 0, "verify": "err", "expl": {"ro": "Nu poți aduna `str` cu `int`. Folosește `str(15)` sau virgulă în `print()`.", "en": "You cannot add `str` and `int`. Use `str(15)` or a comma in `print()`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(int(3.9), round(2.5), 10 / 2)\n", "options": ["4 3 5", "3 2 5.0", "3 3 5.0", "3 2 5"], "answer": 1, "verify": "out", "expl": {"ro": "`int(3.9)` taie zecimalele (3). `round(2.5)` dă 2 (rotunjire la cel mai apropiat număr par). `10 / 2` este `5.0`.", "en": "`int(3.9)` cuts the decimals (3). `round(2.5)` gives 2 (rounds to the nearest even number). `10 / 2` is `5.0`."}}], "exercises": [{"title": {"ro": "Calculatorul de bază", "en": "Basic calculator"}, "task": {"ro": "Variabilele `a = 17` și `b = 5` există deja. Afișează, fiecare pe linia lui și în această ordine: `a + b`, `a - b`, `a * b`, `a / b`, `a // b`, `a % b`, `a ** b`.\n", "en": "The variables `a = 17` and `b = 5` already exist. Print, each on its own line and in this order: `a + b`, `a - b`, `a * b`, `a / b`, `a // b`, `a % b`, `a ** b`.\n"}, "starter": "a = 17\nb = 5\n# print the seven results\n", "hint": {"ro": "Șapte apeluri `print()`, câte unul pentru fiecare operator.", "en": "Seven `print()` calls, one for each operator."}, "solution": "a = 17\nb = 5\nprint(a + b)\nprint(a - b)\nprint(a * b)\nprint(a / b)\nprint(a // b)\nprint(a % b)\nprint(a ** b)\n", "tests": [{"expect": "22\n12\n85\n3.4\n3\n2\n1419857"}]}, {"title": {"ro": "Repară eroarea", "en": "Fix the bug"}, "task": {"ro": "Codul se oprește cu `TypeError`. Repară-l ca să afișeze exact: `Well done Alex! You scored 98`.\n", "en": "The code stops with a `TypeError`. Fix it so it prints exactly: `Well done Alex! You scored 98`.\n"}, "starter": "name = \"Alex\"\nscore = 98\nprint(\"Well done \" + name + \"! You scored \" + score)\n", "hint": {"ro": "Convertește `score` în text cu `str(score)`.", "en": "Convert `score` to text with `str(score)`."}, "solution": "name = \"Alex\"\nscore = 98\nprint(\"Well done \" + name + \"! You scored \" + str(score))\n", "tests": [{"expect": "Well done Alex! You scored 98"}]}, {"title": {"ro": "Detectivul de tipuri", "en": "Type detective"}, "task": {"ro": "Sunt create patru variabile. Afișează tipul fiecăreia (cu `type()`), câte unul pe linie, în ordinea `a`, `b`, `c`, `d`.\n", "en": "Four variables are created. Print the type of each one (using `type()`), one per line, in the order `a`, `b`, `c`, `d`.\n"}, "starter": "a = 42\nb = 2.5\nc = \"42\"\nd = False\n# print the type of each variable\n", "hint": {"ro": "`print(type(a))` afișează `<class 'int'>`.", "en": "`print(type(a))` shows `<class 'int'>`."}, "solution": "a = 42\nb = 2.5\nc = \"42\"\nd = False\nprint(type(a))\nprint(type(b))\nprint(type(c))\nprint(type(d))\n", "tests": [{"expect": "<class 'int'>\n<class 'float'>\n<class 'str'>\n<class 'bool'>"}]}]}, {"id": "l03", "n": 3, "part": 1, "domain": 3, "added": true, "title": {"ro": "Input și afișare formatată", "en": "Input and formatted output"}, "goal": {"ro": "Să citești date de la tastatură cu input(), să le convertești și să afișezi rezultate formatate cu f-string, format(), sep și end.", "en": "Read data from the keyboard with input(), convert it, and print formatted results with f-strings, format(), sep and end."}, "theory": {"ro": "> new: Această lecție acoperă obiectivul 3.2 al examenului (operații de consolă). Nu era în materialele inițiale, dar apare des în test.\n\n### input(): citirea de la tastatură\n\n`input()` oprește programul, așteaptă ca utilizatorul să scrie ceva și apasă Enter. Rezultatul este **întotdeauna text** (`str`), chiar dacă scrii cifre.\n\nSub fiecare cod care folosește `input()` apare o casetă „Date de intrare\": scrie acolo valorile, câte una pe linie, în ordinea în care le cere programul.\n\n```python run err in=Mia|15\nname = input(\"Your name: \")\nage = input(\"Your age: \")\nprint(name, \"will be\", age + 1, \"next year\")\n```\n\nCodul de mai sus se oprește cu `TypeError`, pentru că `age` este text. Repară-l cu conversia `int(age)`:\n\n```python run in=Mia|15\nname = input(\"Your name: \")\nage = int(input(\"Your age: \"))\nprint(name, \"will be\", age + 1, \"next year\")\n```\n\n> exam: `int(input())` citește un număr întreg, `float(input())` unul cu zecimale. Dacă utilizatorul scrie `abc`, `int()` aruncă `ValueError` (vezi lecția despre excepții).\n\n### f-string: text cu valori în el\n\nPune litera `f` înaintea ghilimelelor și scrie variabilele sau expresiile între `{ }`.\n\n```python run\nname = \"Mia\"\nprice = 4.5\nqty = 3\nprint(f\"{name} bought {qty} items for {price * qty} lei\")\n```\n\n### Formatarea valorilor\n\nDupă valoare poți pune `:` și o specificație de format.\n\n| Format | Exemplu | Rezultat |\n|---|---|---|\n| `:.2f` | `f\"{3.14159:.2f}\"` | `3.14` |\n| `:05d` | `f\"{42:05d}\"` | `00042` |\n| `:>6` | `f\"{'hi':>6}\"` | `    hi` (aliniat la dreapta) |\n| `:<6` | `f\"{'hi':<6}\"` | `hi    ` (aliniat la stânga) |\n| `:^6` | `f\"{'hi':^6}\"` | `  hi  ` (centrat) |\n| `:,` | `f\"{1234567:,}\"` | `1,234,567` |\n| `:.1%` | `f\"{0.256:.1%}\"` | `25.6%` |\n\n```python run\npi = 3.14159265\nprint(f\"{pi:.2f}\")\nprint(f\"{42:05d}|{'hi':>6}|{'hi':<6}|{1234567:,}\")\nprint(f\"{0.256:.1%}\")\n```\n\n### Metoda format()\n\nAcelași rezultat se poate obține cu `str.format()`, folosind `{ }` în text.\n\n```python run\nprint(\"{} + {} = {}\".format(2, 3, 2 + 3))\nprint(\"{1} before {0}\".format(\"A\", \"B\"))\nprint(\"{:.2f} lei\".format(12.5))\nprint(\"{name} is {age}\".format(name=\"Ana\", age=15))\n```\n\n### Parametrii sep și end ai lui print()\n\n`sep` este textul pus **între** valori (implicit un spațiu), iar `end` este textul pus **după** tot (implicit `\\n`, adică linie nouă).\n\n```python run\nprint(\"a\", \"b\", \"c\", sep=\"-\")\nprint(\"Loading\", end=\"...\")\nprint(\"done\")\nprint(\"Name:\\tAna\\nAge:\\t15\")   # \\t = tab, \\n = new line\n```\n\n> tip: Pentru ghilimele în interiorul textului folosești alt tip de ghilimele (`'say \"hi\"'`) sau caracterul de scăpare: `\"say \\\"hi\\\"\"`.\n", "en": "> new: This lesson covers exam objective 3.2 (console operations). It was not in the original materials, but it shows up often on the test.\n\n### input(): reading from the keyboard\n\n`input()` pauses the program, waits for the user to type something and press Enter. The result is **always text** (`str`), even if you type digits.\n\nUnder every code block that uses `input()` an \"Input values\" box appears: type the values there, one per line, in the order the program asks for them.\n\n```python run err in=Mia|15\nname = input(\"Your name: \")\nage = input(\"Your age: \")\nprint(name, \"will be\", age + 1, \"next year\")\n```\n\nThe code above stops with a `TypeError`, because `age` is text. Fix it with the conversion `int(age)`:\n\n```python run in=Mia|15\nname = input(\"Your name: \")\nage = int(input(\"Your age: \"))\nprint(name, \"will be\", age + 1, \"next year\")\n```\n\n> exam: `int(input())` reads a whole number, `float(input())` one with decimals. If the user types `abc`, `int()` raises `ValueError` (see the lesson on exceptions).\n\n### f-strings: text with values inside\n\nPut the letter `f` before the quotes and write variables or expressions between `{ }`.\n\n```python run\nname = \"Mia\"\nprice = 4.5\nqty = 3\nprint(f\"{name} bought {qty} items for {price * qty} lei\")\n```\n\n### Formatting values\n\nAfter the value you can put `:` and a format specification.\n\n| Format | Example | Result |\n|---|---|---|\n| `:.2f` | `f\"{3.14159:.2f}\"` | `3.14` |\n| `:05d` | `f\"{42:05d}\"` | `00042` |\n| `:>6` | `f\"{'hi':>6}\"` | `    hi` (right-aligned) |\n| `:<6` | `f\"{'hi':<6}\"` | `hi    ` (left-aligned) |\n| `:^6` | `f\"{'hi':^6}\"` | `  hi  ` (centered) |\n| `:,` | `f\"{1234567:,}\"` | `1,234,567` |\n| `:.1%` | `f\"{0.256:.1%}\"` | `25.6%` |\n\n```python run\npi = 3.14159265\nprint(f\"{pi:.2f}\")\nprint(f\"{42:05d}|{'hi':>6}|{'hi':<6}|{1234567:,}\")\nprint(f\"{0.256:.1%}\")\n```\n\n### The format() method\n\nThe same result can be obtained with `str.format()`, using `{ }` in the text.\n\n```python run\nprint(\"{} + {} = {}\".format(2, 3, 2 + 3))\nprint(\"{1} before {0}\".format(\"A\", \"B\"))\nprint(\"{:.2f} lei\".format(12.5))\nprint(\"{name} is {age}\".format(name=\"Ana\", age=15))\n```\n\n### The sep and end parameters of print()\n\n`sep` is the text put **between** values (a space by default), and `end` is the text put **after** everything (`\\n` by default, which means a new line).\n\n```python run\nprint(\"a\", \"b\", \"c\", sep=\"-\")\nprint(\"Loading\", end=\"...\")\nprint(\"done\")\nprint(\"Name:\\tAna\\nAge:\\t15\")   # \\t = tab, \\n = new line\n```\n\n> tip: For quotes inside text use the other kind of quotes (`'say \"hi\"'`) or the escape character: `\"say \\\"hi\\\"\"`.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce tip returnează `input()` întotdeauna?", "en": "What type does `input()` always return?"}, "options": ["int", "float", "str", {"ro": "depinde de ce scrie utilizatorul", "en": "it depends on what the user types"}], "answer": 2, "expl": {"ro": "`input()` returnează text. Pentru număr trebuie să convertești cu `int()` sau `float()`.", "en": "`input()` returns text. For a number you must convert with `int()` or `float()`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(f\"{3.14159:.2f}\")\n", "options": ["3.14", "3.1", "3.14159", "3.15"], "answer": 0, "verify": "out", "expl": {"ro": "`.2f` înseamnă două zecimale, cu rotunjire.", "en": "`.2f` means two decimals, with rounding."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"a\", \"b\", \"c\", sep=\"-\")\n", "options": ["a b c", "a-b-c", "a-b-c-", "abc"], "answer": 1, "verify": "out", "expl": {"ro": "`sep` se pune doar între valori, nu și după ultima.", "en": "`sep` goes only between values, not after the last one."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"x\", end=\"\")\nprint(\"y\")\n", "options": ["x y", "xy", "x\ny", "y"], "answer": 1, "verify": "out", "expl": {"ro": "`end=\"\"` înlocuiește linia nouă cu nimic, deci `y` apare lipit de `x`.", "en": "`end=\"\"` replaces the new line with nothing, so `y` appears right after `x`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"{} + {} = {}\".format(2, 3, 2 + 3))\n", "options": ["2 + 3 = 5", "{} + {} = {}", "2 + 3 = 2 + 3", "5 + 5 = 5"], "answer": 0, "verify": "out", "expl": {"ro": "Fiecare `{}` este înlocuit, în ordine, cu argumentele lui `format()`.", "en": "Each `{}` is replaced, in order, with the arguments of `format()`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(f\"{42:05d}|{'hi':>5}|{1234567:,}\")\n", "options": ["42|hi|1234567", "00042|   hi|1,234,567", "00042|hi   |1,234,567", "42000|   hi|1.234.567"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "`05d` completează cu zerouri până la 5 cifre, `>5` aliniază la dreapta pe 5 caractere, iar `,` pune separator de mii.", "en": "`05d` pads with zeros to 5 digits, `>5` right-aligns in 5 characters, and `,` adds thousands separators."}}], "exercises": [{"title": {"ro": "Salutul cu vârsta", "en": "Greeting with age"}, "task": {"ro": "Citește un nume și o vârstă (număr întreg) cu `input()`. Afișează exact: `Hello, Ana! Next year you will be 16.` (cu numele și vârsta citite, vârsta crescută cu 1).\n", "en": "Read a name and an age (whole number) with `input()`. Print exactly: `Hello, Ana! Next year you will be 16.` (with the name and age you read, age increased by 1).\n"}, "starter": "name = input(\"Name: \")\n# read the age as an int, then print the greeting\n", "hint": {"ro": "`age = int(input(\"Age: \"))` și apoi `print(f\"Hello, {name}! Next year you will be {age + 1}.\")`.", "en": "`age = int(input(\"Age: \"))` and then `print(f\"Hello, {name}! Next year you will be {age + 1}.\")`."}, "demoInput": ["Ana", "15"], "solution": "name = input(\"Name: \")\nage = int(input(\"Age: \"))\nprint(f\"Hello, {name}! Next year you will be {age + 1}.\")\n", "tests": [{"stdin": ["Ana", "15"], "last": 1, "expect": "Hello, Ana! Next year you will be 16."}, {"stdin": ["Mihai", "17"], "last": 1, "expect": "Hello, Mihai! Next year you will be 18.", "hidden": true}]}, {"title": {"ro": "Chitanța", "en": "The receipt"}, "task": {"ro": "Citește prețul unui produs (`float`) și cantitatea (`int`). Afișează totalul cu două zecimale, în forma `Total: 7.50`.\n", "en": "Read the price of a product (`float`) and the quantity (`int`). Print the total with two decimals, in the form `Total: 7.50`.\n"}, "starter": "price = float(input())\n# read the quantity, then print the total with 2 decimals\n", "hint": {"ro": "Folosește `{price * qty:.2f}` într-un f-string.", "en": "Use `{price * qty:.2f}` inside an f-string."}, "demoInput": ["2.5", "3"], "solution": "price = float(input())\nqty = int(input())\nprint(f\"Total: {price * qty:.2f}\")\n", "tests": [{"stdin": ["2.5", "3"], "last": 1, "expect": "Total: 7.50"}, {"stdin": ["10", "2"], "last": 1, "expect": "Total: 20.00", "hidden": true}]}, {"title": {"ro": "sep și end", "en": "sep and end"}, "task": {"ro": "Folosind `sep` și `end`, afișează pe două linii: `1 | 2 | 3` și `Loading...done`. Fiecare linie trebuie obținută cu un singur apel `print()` (la a doua linie ai nevoie de două apeluri).\n", "en": "Using `sep` and `end`, print two lines: `1 | 2 | 3` and `Loading...done`. The first line must come from a single `print()` call (the second line needs two calls).\n"}, "starter": "# line 1: use sep\n# line 2: use end\n", "hint": {"ro": "`print(1, 2, 3, sep=\" | \")` și apoi `print(\"Loading\", end=\"...\")` urmat de `print(\"done\")`.", "en": "`print(1, 2, 3, sep=\" | \")` and then `print(\"Loading\", end=\"...\")` followed by `print(\"done\")`."}, "solution": "print(1, 2, 3, sep=\" | \")\nprint(\"Loading\", end=\"...\")\nprint(\"done\")\n", "tests": [{"expect": "1 | 2 | 3\nLoading...done"}]}]}, {"id": "l04", "n": 4, "part": 1, "domain": 1, "title": {"ro": "Șiruri de caractere: indexare, felii, metode", "en": "Strings: indexing, slicing, methods"}, "goal": {"ro": "Să accesezi caractere cu indexuri, să tai porțiuni cu slicing și să folosești metodele uzuale ale șirurilor.", "en": "Access characters with indexes, cut portions with slicing, and use the common string methods."}, "theory": {"ro": "Un șir (`str`) este o secvență de caractere. Fiecare caracter are o **poziție** (index), iar Python numără de la **0**.\n\n```python run\nword = \"Python\"\n# index:  0 1 2 3 4 5\n# letter: P y t h o n\nprint(word[0])    # first\nprint(word[3])\nprint(word[-1])   # last (negative index counts from the end)\nprint(word[-2])\nprint(len(word))  # number of characters\n```\n\n### Slicing: o felie din șir\n\nFormatul este `valoare[start:stop:pas]`. Poziția `start` **este inclusă**, poziția `stop` **nu este inclusă**.\n\n```python run\ns = \"Python\"\nprint(s[0:3])    # characters 0, 1, 2\nprint(s[2:5])\nprint(s[:4])     # from the start\nprint(s[3:])     # to the end\nprint(s[::2])    # every second character\nprint(s[::-1])   # reversed\nprint(s[10:20])  # out of range in a slice gives an empty string\n```\n\n> exam: Un index în afara șirului (`s[10]`) dă `IndexError`, dar o felie în afara șirului (`s[10:20]`) dă pur și simplu șirul gol. Șirurile sunt **imutabile**: `s[0] = \"J\"` dă `TypeError`.\n\n```python run err\ns = \"cat\"\ns[0] = \"b\"\n```\n\n### Metode utile\n\nMetodele nu modifică șirul original; returnează un șir nou.\n\n```python run\ntext = \"  Hello, Python Learner!  \"\nprint(text.upper())\nprint(text.lower())\nprint(text.strip())                   # removes spaces from both ends\nprint(text.replace(\"Python\", \"World\"))\nprint(text.count(\"l\"))\nprint(text.strip().startswith(\"Hello\"))\nprint(text.strip().endswith(\"!\"))\nprint(\"banana\".find(\"n\"), \"banana\".find(\"z\"))   # position, or -1 if missing\nprint(\"hello world\".title())\n```\n\n### split() și join()\n\n`split()` desparte un șir într-o listă, iar `join()` face invers.\n\n```python run\nprint(\"a,b,c\".split(\",\"))\nprint(\"one two  three\".split())      # no argument: splits on any spaces\nprint(\"-\".join([\"a\", \"b\", \"c\"]))\nprint(\"abc123\".isalpha(), \"123\".isdigit(), \"abc\".isalpha())\nprint(\"Py\" in \"Python\", \"py\" in \"Python\")   # case matters\n```\n\n> tip: Compararea șirurilor deosebește literele mari de cele mici: `\"a\" == \"A\"` este `False`. Pentru o comparație fără deosebire folosește `.lower()` pe ambele.\n", "en": "A string (`str`) is a sequence of characters. Every character has a **position** (index), and Python counts from **0**.\n\n```python run\nword = \"Python\"\n# index:  0 1 2 3 4 5\n# letter: P y t h o n\nprint(word[0])    # first\nprint(word[3])\nprint(word[-1])   # last (negative index counts from the end)\nprint(word[-2])\nprint(len(word))  # number of characters\n```\n\n### Slicing: a piece of a string\n\nThe format is `value[start:stop:step]`. The `start` position **is included**, the `stop` position **is not included**.\n\n```python run\ns = \"Python\"\nprint(s[0:3])    # characters 0, 1, 2\nprint(s[2:5])\nprint(s[:4])     # from the start\nprint(s[3:])     # to the end\nprint(s[::2])    # every second character\nprint(s[::-1])   # reversed\nprint(s[10:20])  # out of range in a slice gives an empty string\n```\n\n> exam: An index outside the string (`s[10]`) gives `IndexError`, but a slice outside the string (`s[10:20]`) simply gives the empty string. Strings are **immutable**: `s[0] = \"J\"` gives `TypeError`.\n\n```python run err\ns = \"cat\"\ns[0] = \"b\"\n```\n\n### Useful methods\n\nMethods do not change the original string; they return a new one.\n\n```python run\ntext = \"  Hello, Python Learner!  \"\nprint(text.upper())\nprint(text.lower())\nprint(text.strip())                   # removes spaces from both ends\nprint(text.replace(\"Python\", \"World\"))\nprint(text.count(\"l\"))\nprint(text.strip().startswith(\"Hello\"))\nprint(text.strip().endswith(\"!\"))\nprint(\"banana\".find(\"n\"), \"banana\".find(\"z\"))   # position, or -1 if missing\nprint(\"hello world\".title())\n```\n\n### split() and join()\n\n`split()` breaks a string into a list, and `join()` does the opposite.\n\n```python run\nprint(\"a,b,c\".split(\",\"))\nprint(\"one two  three\".split())      # no argument: splits on any spaces\nprint(\"-\".join([\"a\", \"b\", \"c\"]))\nprint(\"abc123\".isalpha(), \"123\".isdigit(), \"abc\".isalpha())\nprint(\"Py\" in \"Python\", \"py\" in \"Python\")   # case matters\n```\n\n> tip: String comparison is case-sensitive: `\"a\" == \"A\"` is `False`. For a case-insensitive comparison use `.lower()` on both.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"Python\"[1:4])\n", "options": ["yth", "ytho", "Pyt", "tho"], "answer": 0, "verify": "out", "expl": {"ro": "Pozițiile 1, 2, 3 sunt `y`, `t`, `h`. Poziția 4 (stop) nu e inclusă.", "en": "Positions 1, 2, 3 are `y`, `t`, `h`. Position 4 (stop) is not included."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"Python\"[-1], \"Python\"[::2])\n", "options": ["n Pto", "P Pto", "n nhy", "n Pyt"], "answer": 0, "verify": "out", "expl": {"ro": "`[-1]` este ultimul caracter, `n`. `[::2]` ia câte un caracter din două: P, t, o.", "en": "`[-1]` is the last character, `n`. `[::2]` takes every second character: P, t, o."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"  hi \".strip().upper())\n", "options": ["HI", "  HI ", "hi", "Hi"], "answer": 0, "verify": "out", "expl": {"ro": "`strip()` scoate spațiile de la capete, apoi `upper()` face literele mari.", "en": "`strip()` removes the spaces at the ends, then `upper()` makes the letters uppercase."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"a,b,c\".split(\",\"))\n", "options": ["['a', 'b', 'c']", "a b c", "('a', 'b', 'c')", "['a,b,c']"], "mono": true, "answer": 0, "verify": "out", "expl": {"ro": "`split(\",\")` returnează o listă cu bucățile dintre virgule.", "en": "`split(\",\")` returns a list with the pieces between the commas."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(\"banana\".count(\"a\"), \"banana\".find(\"n\"), \"banana\".find(\"z\"))\n", "options": ["3 2 -1", "3 3 0", "2 2 -1", "3 2 None"], "answer": 0, "verify": "out", "expl": {"ro": "`count` numără 3 litere `a`; `find(\"n\")` dă prima poziție (2); dacă nu găsește, `find` returnează -1.", "en": "`count` counts 3 letters `a`; `find(\"n\")` gives the first position (2); if it finds nothing, `find` returns -1."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul?", "en": "What error does the code produce?"}, "code": "s = \"cat\"\ns[0] = \"b\"\n", "options": ["TypeError", "IndexError", "ValueError", "AttributeError"], "answer": 0, "verify": "err", "expl": {"ro": "Șirurile sunt imutabile; nu poți schimba un caracter pe loc. Creează un șir nou, de exemplu `\"b\" + s[1:]`.", "en": "Strings are immutable; you cannot change a character in place. Create a new string, for example `\"b\" + s[1:]`."}}], "exercises": [{"title": {"ro": "Tăietorul de nume", "en": "Name slicer"}, "task": {"ro": "Citește un nume complet de forma `Prenume Nume`. Afișează, pe patru linii: prenumele, numele, numele complet cu litere mari și numele complet scris invers.\n", "en": "Read a full name in the form `First Last`. Print four lines: the first name, the last name, the full name in uppercase, and the full name reversed.\n"}, "starter": "full = input(\"Full name: \")\n# print: first name, last name, uppercase, reversed\n", "hint": {"ro": "`full.split()` dă o listă cu două elemente. Pentru invers folosește `full[::-1]`.", "en": "`full.split()` gives a list with two items. For reversed use `full[::-1]`."}, "demoInput": ["Mihai Rusu"], "solution": "full = input(\"Full name: \")\nparts = full.split()\nprint(parts[0])\nprint(parts[1])\nprint(full.upper())\nprint(full[::-1])\n", "tests": [{"stdin": ["Mihai Rusu"], "last": 4, "expect": "Mihai\nRusu\nMIHAI RUSU\nusuR iahiM"}, {"stdin": ["Ana Pop"], "last": 4, "expect": "Ana\nPop\nANA POP\npoP anA", "hidden": true}]}, {"title": {"ro": "Numără vocalele", "en": "Count the vowels"}, "task": {"ro": "Completează funcția `count_vowels(text)`: returnează câte vocale (`a`, `e`, `i`, `o`, `u`, mari sau mici) conține textul.\n", "en": "Complete the function `count_vowels(text)`: return how many vowels (`a`, `e`, `i`, `o`, `u`, uppercase or lowercase) the text contains.\n"}, "starter": "def count_vowels(text):\n    pass\n", "hint": {"ro": "Parcurge șirul cu `for letter in text.lower():` și verifică `letter in \"aeiou\"`.", "en": "Loop over the string with `for letter in text.lower():` and check `letter in \"aeiou\"`."}, "solution": "def count_vowels(text):\n    total = 0\n    for letter in text.lower():\n        if letter in \"aeiou\":\n            total += 1\n    return total\n", "tests": [{"append": "print(count_vowels('Education'))", "expect": "5"}, {"append": "print(count_vowels('sky'))", "expect": "0"}, {"append": "print(count_vowels('AEIOU'))", "expect": "5", "hidden": true}]}, {"title": {"ro": "Provocarea metodelor", "en": "Method challenge"}, "task": {"ro": "Șirul `s` este dat. Afișează, pe trei linii: (1) `s` fără spații la capete și cu fiecare cuvânt începând cu literă mare, (2) de câte ori apare litera `o` în `s`, (3) `s` fără spații la capete, cu `python` înlocuit prin `Moldova`.\n", "en": "The string `s` is given. Print three lines: (1) `s` without spaces at the ends and with every word starting with a capital letter, (2) how many times the letter `o` appears in `s`, (3) `s` without spaces at the ends, with `python` replaced by `Moldova`.\n"}, "starter": "s = \" welcome to python class \"\n# three print() calls\n", "hint": {"ro": "Metodele de care ai nevoie: `strip()`, `title()`, `count()`, `replace()`.", "en": "The methods you need: `strip()`, `title()`, `count()`, `replace()`."}, "solution": "s = \" welcome to python class \"\nprint(s.strip().title())\nprint(s.count(\"o\"))\nprint(s.strip().replace(\"python\", \"Moldova\"))\n", "tests": [{"expect": "Welcome To Python Class\n3\nwelcome to Moldova class"}]}]}, {"id": "l05", "n": 5, "part": 1, "domain": 1, "title": {"ro": "Liste", "en": "Lists"}, "goal": {"ro": "Să creezi și să modifici liste, să folosești indexarea și felierea și să alegi metoda potrivită pentru fiecare operație.", "en": "Create and change lists, use indexing and slicing, and pick the right method for each operation."}, "theory": {"ro": "O listă păstrează mai multe valori într-o singură variabilă. Se scrie între paranteze drepte `[ ]`, păstrează ordinea și poate conține valori de orice tip, chiar amestecate. Spre deosebire de șiruri, **listele se pot modifica**.\n\n```python run\nfruits = [\"apple\", \"banana\", \"cherry\"]\nmixed = [\"Alex\", 15, True, 3.14]\nprint(fruits[0], fruits[-1])\nprint(fruits[1:3])       # slicing works like on strings\nprint(len(fruits))\nfruits[1] = \"kiwi\"       # change an item\nprint(fruits)\n```\n\n### Metodele listelor\n\n| Metodă | Ce face |\n|---|---|\n| `append(x)` | adaugă `x` la sfârșit |\n| `insert(i, x)` | inserează `x` pe poziția `i` |\n| `remove(x)` | șterge prima valoare egală cu `x` |\n| `pop(i)` | șterge și returnează elementul de la `i` (ultimul, dacă nu dai `i`) |\n| `sort()` | sortează lista pe loc |\n| `reverse()` | inversează lista pe loc |\n| `index(x)` | poziția primului `x` |\n| `count(x)` | de câte ori apare `x` |\n| `extend(alta)` | adaugă toate elementele altei liste |\n| `copy()` | o copie a listei |\n| `clear()` | golește lista |\n\n```python run\ncolours = [\"red\", \"green\", \"blue\"]\ncolours.append(\"purple\")\ncolours.insert(0, \"orange\")\ncolours.remove(\"green\")\nlast = colours.pop()\nprint(colours, last)\ncolours.sort()\nprint(colours)\ncolours.reverse()\nprint(colours)\nprint(colours.index(\"red\"), colours.count(\"red\"))\n```\n\n> exam: `sort()`, `reverse()`, `append()` și `remove()` **modifică lista și returnează `None`**. Codul `x = my_list.sort()` pune `None` în `x`. Dacă vrei o listă nouă sortată, folosește `sorted(my_list)`.\n\n```python run\nnums = [3, 1, 2]\nresult = nums.sort()\nprint(result, nums)\nprint(sorted([3, 1, 2], reverse=True))\n```\n\n### Funcții care merg pe liste\n\n```python run\nscores = [88, 95, 70, 100]\nprint(len(scores), sum(scores), min(scores), max(scores))\nprint(sum(scores) / len(scores))\nprint(95 in scores, 50 not in scores)\n```\n\n### Atenție: copiere sau același obiect?\n\n`b = a` nu copiază lista, ci dă listei un al doilea nume. Pentru o copie independentă folosește `a.copy()` sau `a[:]`.\n\n```python run\na = [1, 2, 3]\nb = a\nc = a.copy()\nb.append(4)\nprint(a, b, c)\n```\n\n### Erori frecvente\n\n```python run err\ncolours = [\"red\", \"green\", \"blue\"]\nprint(colours[5])\n```\n\n`IndexError: list index out of range`: lista are 3 elemente, deci indexurile valide sunt 0, 1, 2 (și -1, -2, -3). `remove()` pe o valoare care nu există dă `ValueError`.\n", "en": "A list stores several values in one variable. It is written in square brackets `[ ]`, keeps the order, and can hold values of any type, even mixed. Unlike strings, **lists can be changed**.\n\n```python run\nfruits = [\"apple\", \"banana\", \"cherry\"]\nmixed = [\"Alex\", 15, True, 3.14]\nprint(fruits[0], fruits[-1])\nprint(fruits[1:3])       # slicing works like on strings\nprint(len(fruits))\nfruits[1] = \"kiwi\"       # change an item\nprint(fruits)\n```\n\n### List methods\n\n| Method | What it does |\n|---|---|\n| `append(x)` | adds `x` at the end |\n| `insert(i, x)` | inserts `x` at position `i` |\n| `remove(x)` | deletes the first value equal to `x` |\n| `pop(i)` | deletes and returns the item at `i` (the last one if you give no `i`) |\n| `sort()` | sorts the list in place |\n| `reverse()` | reverses the list in place |\n| `index(x)` | position of the first `x` |\n| `count(x)` | how many times `x` appears |\n| `extend(other)` | adds all items of another list |\n| `copy()` | a copy of the list |\n| `clear()` | empties the list |\n\n```python run\ncolours = [\"red\", \"green\", \"blue\"]\ncolours.append(\"purple\")\ncolours.insert(0, \"orange\")\ncolours.remove(\"green\")\nlast = colours.pop()\nprint(colours, last)\ncolours.sort()\nprint(colours)\ncolours.reverse()\nprint(colours)\nprint(colours.index(\"red\"), colours.count(\"red\"))\n```\n\n> exam: `sort()`, `reverse()`, `append()` and `remove()` **change the list and return `None`**. The code `x = my_list.sort()` puts `None` in `x`. If you want a new sorted list, use `sorted(my_list)`.\n\n```python run\nnums = [3, 1, 2]\nresult = nums.sort()\nprint(result, nums)\nprint(sorted([3, 1, 2], reverse=True))\n```\n\n### Functions that work on lists\n\n```python run\nscores = [88, 95, 70, 100]\nprint(len(scores), sum(scores), min(scores), max(scores))\nprint(sum(scores) / len(scores))\nprint(95 in scores, 50 not in scores)\n```\n\n### Careful: a copy or the same object?\n\n`b = a` does not copy the list, it gives the list a second name. For an independent copy use `a.copy()` or `a[:]`.\n\n```python run\na = [1, 2, 3]\nb = a\nc = a.copy()\nb.append(4)\nprint(a, b, c)\n```\n\n### Common errors\n\n```python run err\ncolours = [\"red\", \"green\", \"blue\"]\nprint(colours[5])\n```\n\n`IndexError: list index out of range`: the list has 3 items, so the valid indexes are 0, 1, 2 (and -1, -2, -3). `remove()` on a value that does not exist gives `ValueError`.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "x = [3, 1, 2]\ny = x.sort()\nprint(y)\n", "options": ["[1, 2, 3]", "None", "[3, 1, 2]", "Error"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "`sort()` modifică lista pe loc și returnează `None`.", "en": "`sort()` changes the list in place and returns `None`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)\n", "options": ["[1, 2, 3]", "[1, 2, 3, 4]", "[4]", "Error"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "`b = a` nu copiază lista; `a` și `b` sunt aceeași listă.", "en": "`b = a` does not copy the list; `a` and `b` are the same list."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "items = [\"a\", \"b\", \"c\", \"d\"]\nitems.pop(1)\nitems.insert(0, \"z\")\nprint(items)\n", "options": ["['z', 'a', 'c', 'd']", "['z', 'b', 'c', 'd']", "['a', 'z', 'c', 'd']", "['z', 'a', 'b', 'c']"], "mono": true, "answer": 0, "verify": "out", "expl": {"ro": "`pop(1)` scoate `b`; apoi `insert(0, \"z\")` pune `z` la început.", "en": "`pop(1)` removes `b`; then `insert(0, \"z\")` puts `z` at the start."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "n = [10, 20, 30, 40, 50]\nprint(n[1:4], n[-2:], len(n))\n", "options": ["[20, 30, 40] [40, 50] 5", "[20, 30, 40, 50] [50] 5", "[10, 20, 30] [40, 50] 5", "[20, 30, 40] [40, 50] 4"], "mono": true, "answer": 0, "verify": "out", "expl": {"ro": "`n[1:4]` ia pozițiile 1, 2, 3. `n[-2:]` ia ultimele două elemente.", "en": "`n[1:4]` takes positions 1, 2, 3. `n[-2:]` takes the last two items."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul?", "en": "What error does the code produce?"}, "code": "colours = [\"red\", \"green\"]\ncolours.remove(\"blue\")\n", "options": ["ValueError", "IndexError", "KeyError", "TypeError"], "answer": 0, "verify": "err", "expl": {"ro": "`remove()` dă `ValueError` când valoarea nu există în listă.", "en": "`remove()` gives `ValueError` when the value is not in the list."}}, {"type": "multi", "q": {"ro": "Care apeluri modifică lista pe loc?", "en": "Which calls change the list in place?"}, "options": ["my_list.append(1)", "sorted(my_list)", "my_list.reverse()", "len(my_list)"], "mono": true, "answer": [0, 2], "expl": {"ro": "`append()` și `reverse()` modifică lista. `sorted()` returnează o listă nouă, iar `len()` doar numără.", "en": "`append()` and `reverse()` change the list. `sorted()` returns a new list, and `len()` only counts."}}], "exercises": [{"title": {"ro": "Managerul de playlist", "en": "Playlist manager"}, "task": {"ro": "Lista `playlist` are 4 melodii. Adaugă la sfârșit `\"Delta\"`, șterge `\"Beta\"`, sortează lista alfabetic, apoi afișează lista și numărul de melodii (pe două linii).\n", "en": "The list `playlist` has 4 songs. Add `\"Delta\"` at the end, remove `\"Beta\"`, sort the list alphabetically, then print the list and the number of songs (on two lines).\n"}, "starter": "playlist = [\"Echo\", \"Beta\", \"Alpha\", \"Charlie\"]\n# append, remove, sort, then print the list and its length\n", "hint": {"ro": "Metodele: `append`, `remove`, `sort`. Apoi `print(playlist)` și `print(len(playlist))`.", "en": "The methods: `append`, `remove`, `sort`. Then `print(playlist)` and `print(len(playlist))`."}, "solution": "playlist = [\"Echo\", \"Beta\", \"Alpha\", \"Charlie\"]\nplaylist.append(\"Delta\")\nplaylist.remove(\"Beta\")\nplaylist.sort()\nprint(playlist)\nprint(len(playlist))\n", "tests": [{"expect": "['Alpha', 'Charlie', 'Delta', 'Echo']\n4"}]}, {"title": {"ro": "Statistica notelor", "en": "Grade statistics"}, "task": {"ro": "Completează funcția `stats(numbers)`: returnează o listă cu trei valori `[minim, maxim, medie]`, unde media este suma împărțită la numărul de elemente.\n", "en": "Complete the function `stats(numbers)`: return a list with three values `[minimum, maximum, average]`, where the average is the sum divided by the number of items.\n"}, "starter": "def stats(numbers):\n    pass\n", "hint": {"ro": "Folosește `min()`, `max()`, `sum()` și `len()`.", "en": "Use `min()`, `max()`, `sum()` and `len()`."}, "solution": "def stats(numbers):\n    return [min(numbers), max(numbers), sum(numbers) / len(numbers)]\n", "tests": [{"append": "print(stats([88, 95, 70, 100]))", "expect": "[70, 100, 88.25]"}, {"append": "print(stats([5]))", "expect": "[5, 5, 5.0]", "hidden": true}]}, {"title": {"ro": "Elimină dublurile păstrând ordinea", "en": "Remove duplicates keeping order"}, "task": {"ro": "Completează funcția `unique(items)`: returnează o listă nouă cu elementele din `items`, fără dubluri, în ordinea primei apariții.\n", "en": "Complete the function `unique(items)`: return a new list with the items from `items`, without duplicates, in order of first appearance.\n"}, "starter": "def unique(items):\n    pass\n", "hint": {"ro": "Creează o listă goală `result`; pentru fiecare element, adaugă-l doar dacă `not in result`.", "en": "Create an empty list `result`; for each item, add it only if it is `not in result`."}, "solution": "def unique(items):\n    result = []\n    for item in items:\n        if item not in result:\n            result.append(item)\n    return result\n", "tests": [{"append": "print(unique([3, 7, 2, 7, 5, 3, 9, 2, 1]))", "expect": "[3, 7, 2, 5, 9, 1]"}, {"append": "print(unique([]))", "expect": "[]", "hidden": true}]}]}, {"id": "l06", "n": 6, "part": 1, "domain": 1, "title": {"ro": "Tuple, mulțimi și dicționare", "en": "Tuples, sets and dictionaries"}, "goal": {"ro": "Să alegi structura potrivită (listă, tuplu, mulțime, dicționar) și să folosești metodele fiecăreia.", "en": "Pick the right structure (list, tuple, set, dictionary) and use the methods of each one."}, "theory": {"ro": "### Tuple: ordonate și nemodificabile\n\nUn tuplu se scrie între paranteze rotunde `( )`. Seamănă cu o listă, dar după creare **nu se mai poate schimba**. Se potrivește pentru date fixe: coordonate, culori RGB, zilele săptămânii.\n\n```python run\npoint = (3, 7)\ncolours = (\"red\", \"green\", \"red\")\nsingle = (42,)              # a one-item tuple needs the comma\nprint(point[0], len(colours), colours.count(\"red\"), colours.index(\"green\"))\nx, y = point                # unpacking\nprint(x, y)\nprint(type((42)), type(single))\n```\n\n```python run err\npoint = (3, 7)\npoint[0] = 9\n```\n\n> exam: `(42)` este doar numărul 42 între paranteze; tuplul cu un element este `(42,)`. Un tuplu nu are `append`, `remove` sau `sort`.\n\n### Mulțimi (set): valori unice\n\nO mulțime se scrie între acolade `{ }`, elimină dublurile și **nu are ordine**, deci nu poți folosi indexuri. Se folosește pentru valori unice și pentru comparații între grupuri.\n\n```python run\ntags = {\"python\", \"fun\", \"python\", \"code\"}\nprint(len(tags))            # 3: duplicates are dropped\ntags.add(\"beginner\")\ntags.discard(\"fun\")         # no error if missing\nprint(\"python\" in tags)\na = {1, 2, 3, 4}\nb = {3, 4, 5, 6}\nprint(a & b)                # intersection (same as a.intersection(b))\nprint(a | b)                # union\nprint(a - b)                # difference\nprint(set([3, 7, 2, 7, 5, 3]))\nprint(type({}), type(set()))\n```\n\n> exam: `{}` gol este un **dicționar**, nu o mulțime. Mulțimea goală se creează cu `set()`. `remove(x)` dă `KeyError` dacă `x` lipsește; `discard(x)` nu dă eroare.\n\n### Dicționare: perechi cheie–valoare\n\nUn dicționar caută valori după o **cheie**, nu după poziție. Cheile sunt unice și nemodificabile (text, numere, tuple).\n\n```python run\nstudent = {\"name\": \"Mia\", \"age\": 16, \"courses\": [\"Maths\", \"Python\"]}\nprint(student[\"name\"])\nprint(student.get(\"email\"))             # None if missing, no error\nprint(student.get(\"email\", \"not set\"))  # a default value\nstudent[\"age\"] = 17                     # update\nstudent[\"email\"] = \"mia@school.md\"      # add a new key\ndel student[\"courses\"]\nprint(student)\nprint(list(student.keys()))\nprint(list(student.values()))\nprint(\"name\" in student, \"Mia\" in student)   # `in` checks keys\n```\n\nParcurgerea unui dicționar:\n\n```python run\ngrades = {\"Sam\": 88, \"Ana\": 95, \"Leo\": 72}\nfor name, score in grades.items():\n    print(name, score)\nfor name in grades:          # loops over keys\n    print(name)\ngrades.update({\"Mo\": 60})\nprint(grades.pop(\"Leo\"), len(grades))\n```\n\n```python run err\ndata = {\"a\": 1}\nprint(data[\"z\"])\n```\n\n### Ce structură aleg?\n\n| Structură | Ordonată | Modificabilă | Dubluri | Folosește când |\n|---|---|---|---|---|\n| listă `[ ]` | da | da | da | contează ordinea și modifici elementele |\n| tuplu `( )` | da | nu | da | datele nu trebuie să se schimbe |\n| mulțime `{ }` | nu | da | nu | vrei valori unice sau comparații |\n| dicționar `{k: v}` | da (din Python 3.7) | da | chei unice | cauți după nume/cheie |\n", "en": "### Tuples: ordered and unchangeable\n\nA tuple is written in round brackets `( )`. It looks like a list, but after creation it **cannot be changed**. It fits fixed data: coordinates, RGB colours, the days of the week.\n\n```python run\npoint = (3, 7)\ncolours = (\"red\", \"green\", \"red\")\nsingle = (42,)              # a one-item tuple needs the comma\nprint(point[0], len(colours), colours.count(\"red\"), colours.index(\"green\"))\nx, y = point                # unpacking\nprint(x, y)\nprint(type((42)), type(single))\n```\n\n```python run err\npoint = (3, 7)\npoint[0] = 9\n```\n\n> exam: `(42)` is just the number 42 in parentheses; the one-item tuple is `(42,)`. A tuple has no `append`, `remove` or `sort`.\n\n### Sets: unique values\n\nA set is written in braces `{ }`, removes duplicates and **has no order**, so you cannot use indexes. It is used for unique values and for comparing groups.\n\n```python run\ntags = {\"python\", \"fun\", \"python\", \"code\"}\nprint(len(tags))            # 3: duplicates are dropped\ntags.add(\"beginner\")\ntags.discard(\"fun\")         # no error if missing\nprint(\"python\" in tags)\na = {1, 2, 3, 4}\nb = {3, 4, 5, 6}\nprint(a & b)                # intersection (same as a.intersection(b))\nprint(a | b)                # union\nprint(a - b)                # difference\nprint(set([3, 7, 2, 7, 5, 3]))\nprint(type({}), type(set()))\n```\n\n> exam: An empty `{}` is a **dictionary**, not a set. The empty set is created with `set()`. `remove(x)` gives `KeyError` if `x` is missing; `discard(x)` gives no error.\n\n### Dictionaries: key–value pairs\n\nA dictionary looks values up by a **key**, not by position. Keys are unique and unchangeable (text, numbers, tuples).\n\n```python run\nstudent = {\"name\": \"Mia\", \"age\": 16, \"courses\": [\"Maths\", \"Python\"]}\nprint(student[\"name\"])\nprint(student.get(\"email\"))             # None if missing, no error\nprint(student.get(\"email\", \"not set\"))  # a default value\nstudent[\"age\"] = 17                     # update\nstudent[\"email\"] = \"mia@school.md\"      # add a new key\ndel student[\"courses\"]\nprint(student)\nprint(list(student.keys()))\nprint(list(student.values()))\nprint(\"name\" in student, \"Mia\" in student)   # `in` checks keys\n```\n\nLooping over a dictionary:\n\n```python run\ngrades = {\"Sam\": 88, \"Ana\": 95, \"Leo\": 72}\nfor name, score in grades.items():\n    print(name, score)\nfor name in grades:          # loops over keys\n    print(name)\ngrades.update({\"Mo\": 60})\nprint(grades.pop(\"Leo\"), len(grades))\n```\n\n```python run err\ndata = {\"a\": 1}\nprint(data[\"z\"])\n```\n\n### Which structure do I pick?\n\n| Structure | Ordered | Changeable | Duplicates | Use when |\n|---|---|---|---|---|\n| list `[ ]` | yes | yes | yes | order matters and you change items |\n| tuple `( )` | yes | no | yes | the data must not change |\n| set `{ }` | no | yes | no | you want unique values or comparisons |\n| dictionary `{k: v}` | yes (since Python 3.7) | yes | unique keys | you look things up by name/key |\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce tip are `(42)`?", "en": "What type is `(42)`?"}, "code": "print(type((42)))\n", "options": ["<class 'tuple'>", "<class 'int'>", "<class 'list'>", "<class 'str'>"], "mono": true, "answer": 1, "verify": "out", "expl": {"ro": "Parantezele singure nu fac un tuplu. Tuplul cu un element are virgulă: `(42,)`.", "en": "Parentheses alone do not make a tuple. The one-item tuple has a comma: `(42,)`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "s = {1, 2, 2, 3, 3, 3}\nprint(len(s))\n", "options": ["6", "3", "2", "1"], "answer": 1, "verify": "out", "expl": {"ro": "Mulțimea păstrează doar valorile unice: 1, 2, 3.", "en": "The set keeps only unique values: 1, 2, 3."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "a = {1, 2, 3, 4}\nb = {3, 4, 5}\nprint(a & b, a - b)\n", "options": ["{3, 4} {1, 2}", "{1, 2, 3, 4, 5} {5}", "{3, 4} {5}", "{1, 2} {3, 4}"], "mono": true, "answer": 0, "verify": "out", "expl": {"ro": "`&` este intersecția (comune), `-` este diferența (doar în prima).", "en": "`&` is the intersection (common items), `-` is the difference (only in the first)."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "d = {\"a\": 1}\nprint(d.get(\"b\"), d.get(\"b\", 0), \"a\" in d)\n", "options": ["None 0 True", "0 0 True", "None None False", "Error"], "answer": 0, "verify": "out", "expl": {"ro": "`get` nu dă eroare: returnează `None` sau valoarea implicită. `in` verifică cheile.", "en": "`get` gives no error: it returns `None` or the default value. `in` checks the keys."}}, {"type": "mcq", "q": {"ro": "Ce eroare produce codul?", "en": "What error does the code produce?"}, "code": "data = {\"a\": 1}\nprint(data[\"z\"])\n", "options": ["KeyError", "IndexError", "ValueError", "NameError"], "answer": 0, "verify": "err", "expl": {"ro": "Accesul cu `[ ]` la o cheie inexistentă dă `KeyError`; `get()` ar fi evitat eroarea.", "en": "Accessing a missing key with `[ ]` gives `KeyError`; `get()` would have avoided the error."}}, {"type": "yesno", "q": {"ro": "Alege Da sau Nu: afirmația este adevărată?", "en": "Choose Yes or No: is the statement true?"}, "items": [{"t": "type({}) == dict", "py": "type({}) == dict", "ans": true, "code": true}, {"t": "type({1, 2}) == set", "py": "type({1, 2}) == set", "ans": true, "code": true}, {"t": "type((1)) == tuple", "py": "type((1)) == tuple", "ans": false, "code": true}, {"t": "len({'a': 1, 'a': 2}) == 2", "py": "len({'a': 1, 'a': 2}) == 2", "ans": false, "code": true}], "expl": {"ro": "`{}` este dicționar; `{1, 2}` este mulțime; `(1)` este `int`; o cheie duplicată o suprascrie pe prima, deci lungimea este 1.", "en": "`{}` is a dictionary; `{1, 2}` is a set; `(1)` is an `int`; a duplicate key overwrites the first, so the length is 1."}}], "exercises": [{"title": {"ro": "Cartea", "en": "The book"}, "task": {"ro": "Dicționarul `book` are cheile `title`, `author`, `pages`. Adaugă cheia `rating` cu valoarea `5`, șterge cheia `pages`, apoi afișează `book`.\n", "en": "The dictionary `book` has the keys `title`, `author`, `pages`. Add the key `rating` with the value `5`, delete the key `pages`, then print `book`.\n"}, "starter": "book = {\"title\": \"Dune\", \"author\": \"Herbert\", \"pages\": 412}\n# add rating, delete pages, print the dictionary\n", "hint": {"ro": "`book[\"rating\"] = 5` și `del book[\"pages\"]`.", "en": "`book[\"rating\"] = 5` and `del book[\"pages\"]`."}, "solution": "book = {\"title\": \"Dune\", \"author\": \"Herbert\", \"pages\": 412}\nbook[\"rating\"] = 5\ndel book[\"pages\"]\nprint(book)\n", "tests": [{"expect": "{'title': 'Dune', 'author': 'Herbert', 'rating': 5}"}]}, {"title": {"ro": "Invitații unici", "en": "Unique guests"}, "task": {"ro": "Completează funcția `count_unique(items)`: returnează câte valori **diferite** conține lista.\n", "en": "Complete the function `count_unique(items)`: return how many **different** values the list contains.\n"}, "starter": "def count_unique(items):\n    pass\n", "hint": {"ro": "Convertește lista în mulțime cu `set(items)` și numără cu `len()`.", "en": "Convert the list to a set with `set(items)` and count with `len()`."}, "solution": "def count_unique(items):\n    return len(set(items))\n", "tests": [{"append": "print(count_unique(['Sam', 'Ana', 'Sam', 'Leo', 'Ana', 'Mo']))", "expect": "4"}, {"append": "print(count_unique([]))", "expect": "0", "hidden": true}]}, {"title": {"ro": "Frecvența literelor", "en": "Letter frequency"}, "task": {"ro": "Completează funcția `frequency(text)`: returnează un dicționar care spune de câte ori apare fiecare caracter din `text`.\n", "en": "Complete the function `frequency(text)`: return a dictionary telling how many times each character of `text` appears.\n"}, "starter": "def frequency(text):\n    pass\n", "hint": {"ro": "Pentru fiecare caracter: `counts[ch] = counts.get(ch, 0) + 1`.", "en": "For each character: `counts[ch] = counts.get(ch, 0) + 1`."}, "solution": "def frequency(text):\n    counts = {}\n    for ch in text:\n        counts[ch] = counts.get(ch, 0) + 1\n    return counts\n", "tests": [{"append": "print(frequency('banana'))", "expect": "{'b': 1, 'a': 3, 'n': 2}"}, {"append": "print(frequency(''))", "expect": "{}", "hidden": true}]}]}, {"id": "l07", "n": 7, "part": 2, "domain": 1, "added": true, "title": {"ro": "Operatori și precedență", "en": "Operators and precedence"}, "goal": {"ro": "Să recunoști cele 7 grupe de operatori, să stabilești ordinea de evaluare a unei expresii și să alegi operatorul potrivit.", "en": "Recognise the 7 operator groups, work out the evaluation order of an expression, and choose the right operator."}, "theory": {"ro": "> new: Obiectivele 1.3 și 1.4 ale examenului cer ordinea de evaluare și alegerea operatorilor. Partea despre precedență este o completare față de materialele inițiale.\n\n### Cele șapte grupe\n\n| Grupă | Operatori | Scop |\n|---|---|---|\n| Aritmetici | `+ - * / // % **` | calcule |\n| De atribuire | `= += -= *= /= //= %= **=` | dau sau actualizează o valoare |\n| De comparație | `== != > < >= <=` | compară și dau `True`/`False` |\n| Logici | `and or not` | combină condiții |\n| De identitate | `is`, `is not` | verifică dacă sunt **același obiect** |\n| De apartenență | `in`, `not in` | verifică dacă o valoare e într-o secvență |\n| Pe biți | `& \\| ^ ~ << >>` | lucrează pe cifrele binare |\n\n```python run\nx = 10\nx += 5      # same as x = x + 5\nx *= 2      # x = x * 2\nx -= 3\nx //= 2\nprint(x)\nprint(5 == 5.0, 5 != 6, 3 >= 4)\nprint(1 < 5 < 10)           # chained comparison: 1 < 5 and 5 < 10\n```\n\n### == și is\n\n`==` compară **valorile**. `is` compară **identitatea** (același obiect în memorie). Pentru liste cu același conținut, `==` este `True`, iar `is` este `False`. Se folosește `is` mai ales cu `None`.\n\n```python run\na = [1, 2, 3]\nb = [1, 2, 3]\nc = a\nprint(a == b, a is b, a is c)\nvalue = None\nprint(value is None, value is not None)\n```\n\n### and, or, not\n\n`and` este `True` doar dacă ambele părți sunt adevărate. `or` este `True` dacă măcar una este. `not` inversează. Python evaluează de la stânga la dreapta și se oprește când rezultatul e sigur (**evaluare scurtcircuitată**). Rezultatul lui `and`/`or` este una dintre valorile comparate, nu neapărat `True`/`False`.\n\n```python run\nprint(True and False, True or False, not True)\nprint(0 or 5, 3 and 4, not 0)\nprint(4 % 2 == 0 or 1 / 0)    # the second part is never evaluated\nprint(\"a\" in \"cat\", 3 not in [1, 2, 3])\n```\n\n### Precedența: ce se calculează primul?\n\nDe la cel mai puternic la cel mai slab:\n\n1. paranteze `( )`\n2. `**`\n3. semn unar `-x`\n4. `*  /  //  %`\n5. `+  -`\n6. comparații (`==  <  >  in  is` ...)\n7. `not`\n8. `and`\n9. `or`\n\n```python run\nprint(2 + 3 * 4 ** 2)     # 2 + 3 * 16 = 50\nprint(-2 ** 2)            # -(2 ** 2) = -4\nprint((2 + 3) * 4)\nprint(10 - 4 - 3)         # left to right: (10 - 4) - 3\nprint(2 ** 3 ** 2)        # ** goes right to left: 2 ** 9\nprint(not 1 == 2 and 3 > 1)\n```\n\n> exam: La operatori cu aceeași precedență, evaluarea merge de la stânga la dreapta, cu o excepție: `**` merge de la dreapta la stânga. Când ai îndoieli, pune paranteze: nu costă nimic și face codul clar.\n", "en": "> new: Exam objectives 1.3 and 1.4 ask for evaluation order and operator choice. The precedence part is an addition to the original materials.\n\n### The seven groups\n\n| Group | Operators | Purpose |\n|---|---|---|\n| Arithmetic | `+ - * / // % **` | calculations |\n| Assignment | `= += -= *= /= //= %= **=` | give or update a value |\n| Comparison | `== != > < >= <=` | compare and give `True`/`False` |\n| Logical | `and or not` | combine conditions |\n| Identity | `is`, `is not` | check whether they are the **same object** |\n| Membership | `in`, `not in` | check whether a value is in a sequence |\n| Bitwise | `& \\| ^ ~ << >>` | work on binary digits |\n\n```python run\nx = 10\nx += 5      # same as x = x + 5\nx *= 2      # x = x * 2\nx -= 3\nx //= 2\nprint(x)\nprint(5 == 5.0, 5 != 6, 3 >= 4)\nprint(1 < 5 < 10)           # chained comparison: 1 < 5 and 5 < 10\n```\n\n### == and is\n\n`==` compares **values**. `is` compares **identity** (the same object in memory). For lists with the same content, `==` is `True` and `is` is `False`. `is` is mostly used with `None`.\n\n```python run\na = [1, 2, 3]\nb = [1, 2, 3]\nc = a\nprint(a == b, a is b, a is c)\nvalue = None\nprint(value is None, value is not None)\n```\n\n### and, or, not\n\n`and` is `True` only if both sides are true. `or` is `True` if at least one is. `not` inverts. Python evaluates left to right and stops as soon as the result is certain (**short-circuit evaluation**). The result of `and`/`or` is one of the compared values, not necessarily `True`/`False`.\n\n```python run\nprint(True and False, True or False, not True)\nprint(0 or 5, 3 and 4, not 0)\nprint(4 % 2 == 0 or 1 / 0)    # the second part is never evaluated\nprint(\"a\" in \"cat\", 3 not in [1, 2, 3])\n```\n\n### Precedence: what is calculated first?\n\nFrom strongest to weakest:\n\n1. parentheses `( )`\n2. `**`\n3. unary sign `-x`\n4. `*  /  //  %`\n5. `+  -`\n6. comparisons (`==  <  >  in  is` ...)\n7. `not`\n8. `and`\n9. `or`\n\n```python run\nprint(2 + 3 * 4 ** 2)     # 2 + 3 * 16 = 50\nprint(-2 ** 2)            # -(2 ** 2) = -4\nprint((2 + 3) * 4)\nprint(10 - 4 - 3)         # left to right: (10 - 4) - 3\nprint(2 ** 3 ** 2)        # ** goes right to left: 2 ** 9\nprint(not 1 == 2 and 3 > 1)\n```\n\n> exam: Operators with the same precedence are evaluated left to right, with one exception: `**` goes right to left. When in doubt, add parentheses: they cost nothing and make the code clear.\n"}, "check": [{"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(2 + 3 * 4 ** 2)\n", "options": ["400", "50", "80", "98"], "answer": 1, "verify": "out", "expl": {"ro": "Întâi `4 ** 2 = 16`, apoi `3 * 16 = 48`, apoi `2 + 48 = 50`.", "en": "First `4 ** 2 = 16`, then `3 * 16 = 48`, then `2 + 48 = 50`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(-2 ** 2, 2 ** 3 ** 2)\n", "options": ["4 64", "-4 512", "-4 64", "4 512"], "answer": 1, "verify": "out", "expl": {"ro": "`**` are prioritate față de minusul unar: `-(2 ** 2) = -4`. Iar `2 ** 3 ** 2` se evaluează de la dreapta: `2 ** 9 = 512`.", "en": "`**` beats the unary minus: `-(2 ** 2) = -4`. And `2 ** 3 ** 2` is evaluated from the right: `2 ** 9 = 512`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "print(0 or 5, 3 and 4, not 0)\n", "options": ["5 4 True", "True True True", "0 3 False", "5 3 True"], "answer": 0, "verify": "out", "expl": {"ro": "`0 or 5` dă 5 (prima valoare adevărată). `3 and 4` dă 4 (ultima, dacă toate sunt adevărate). `not 0` este `True`.", "en": "`0 or 5` gives 5 (the first true value). `3 and 4` gives 4 (the last one, if all are true). `not 0` is `True`."}}, {"type": "mcq", "q": {"ro": "Ce afișează codul?", "en": "What does the code print?"}, "code": "a = [1, 2]\nb = [1, 2]\nprint(a == b, a is b)\n", "options": ["True True", "True False", "False True", "False False"], "answer": 1, "verify": "out", "expl": {"ro": "Valorile sunt egale, dar sunt două obiecte diferite în memorie.", "en": "The values are equal, but they are two different objects in memory."}}, {"type": "mcq", "q": {"ro": "Ce valoare are `x` la final?", "en": "What value does `x` have at the end?"}, "code": "x = 5\nx *= 2\nx -= 3\nx //= 2\nprint(x)\n", "options": ["3", "4", "2", "7"], "answer": 0, "verify": "out", "expl": {"ro": "5 → 10 → 7 → 3 (`7 // 2` este 3).", "en": "5 → 10 → 7 → 3 (`7 // 2` is 3)."}}, {"type": "yesno", "q": {"ro": "Alege Da sau Nu: expresia are valoarea `True`?", "en": "Choose Yes or No: does the expression evaluate to `True`?"}, "items": [{"t": "5 > 3 and 2 > 4", "py": "5 > 3 and 2 > 4", "ans": false, "code": true}, {"t": "not (1 == 2)", "py": "not (1 == 2)", "ans": true, "code": true}, {"t": "1 < 5 < 3", "py": "1 < 5 < 3", "ans": false, "code": true}, {"t": "(4 % 2 == 0) or (1 / 0)", "py": "(4 % 2 == 0) or (1 / 0)", "ans": true, "code": true}, {"t": "'a' in 'cat'", "py": "'a' in 'cat'", "ans": true, "code": true}], "expl": {"ro": "Ultima parte din `or` nu se mai evaluează dacă prima e adevărată (scurtcircuit), deci nu apare `ZeroDivisionError`.", "en": "The last part of `or` is not evaluated if the first is true (short-circuit), so no `ZeroDivisionError` appears."}}], "exercises": [{"title": {"ro": "An bisect", "en": "Leap year"}, "task": {"ro": "Completează `is_leap(year)`: un an este bisect dacă se împarte la 4 **și** nu se împarte la 100, **sau** se împarte la 400. Returnează `True` sau `False`.\n", "en": "Complete `is_leap(year)`: a year is a leap year if it is divisible by 4 **and** not by 100, **or** divisible by 400. Return `True` or `False`.\n"}, "starter": "def is_leap(year):\n    pass\n", "hint": {"ro": "`return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0`", "en": "`return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0`"}, "solution": "def is_leap(year):\n    return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0\n", "tests": [{"append": "print(is_leap(2000), is_leap(1900), is_leap(2024), is_leap(2023))", "expect": "True False True False"}, {"append": "print(is_leap(2100), is_leap(1996))", "expect": "False True", "hidden": true}]}, {"title": {"ro": "În interval", "en": "In range"}, "task": {"ro": "Completează `in_range(x, low, high)`: returnează `True` dacă `x` este între `low` și `high`, inclusiv capetele. Folosește o comparație înlănțuită.\n", "en": "Complete `in_range(x, low,
